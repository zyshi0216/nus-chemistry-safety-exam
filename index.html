<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUS Chemistry | Laboratory Safety Practice</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#16243c}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #d9e2ee;background:#fff;border-radius:10px;padding:10px 14px;color:#223b5d;font-weight:650}button:hover{background:#eff5fd}button:disabled{opacity:.4;cursor:default}.primary{background:#184e9f;color:white;border-color:#184e9f}.primary:hover{background:#103d82}.wrap{max-width:1120px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}.brand{font-size:22px;font-weight:850;color:#173c78}.subtitle{font-size:13px;color:#667993;margin-top:5px}.nav,.actions,.line{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.line{justify-content:space-between}.panel{background:white;border:1px solid #e0e7f0;border-radius:16px;padding:23px;margin-bottom:16px;box-shadow:0 4px 20px #183e6e08}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.metric{background:#fff;border:1px solid #e0e7f0;border-radius:13px;padding:17px}.metric strong{display:block;font-size:28px;margin:6px 0}.muted{color:#71819a}.small{font-size:13px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#4770a7}.chapter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.chapter{border:1px solid #e0e7f0;border-radius:13px;padding:18px;background:#fff}.chapter h3{margin:7px 0}.chapter .line{margin-top:15px}.tag{display:inline-block;border-radius:30px;background:#edf3ff;color:#285b9f;font-size:12px;font-weight:750;padding:5px 9px}.question{font-size:20px;font-weight:750;line-height:1.5;margin:15px 0 9px}.cn{color:#6c7c93;line-height:1.55;margin:6px 0 14px}.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;font-weight:450;padding:14px;margin:9px 0;border:1px solid #dfe7f0;border-radius:11px;background:white}.option.selected{background:#eaf2ff;border-color:#3c75d2}.option.correct{background:#e8f8ef;border-color:#28a36a}.option.incorrect{background:#fff0ef;border-color:#d35e5e}.letter{display:inline-grid;place-items:center;flex:none;background:#edf2f8;border-radius:7px;width:27px;height:27px;font-weight:750}.progress{height:8px;background:#e8eef7;border-radius:30px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#245fbc}.steps{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.steps button{padding:7px 10px;min-width:35px}.steps .answered{background:#e7f0ff}.steps .current{outline:2px solid #1b58af}.bookmark{color:#8d5a15}.bookmark.active{color:#9c6500;background:#fff4d8;border-color:#e5c06c}.select{padding:9px;border:1px solid #d9e2ee;border-radius:9px;background:#fff}.review{border-left:4px solid #dfa04a;background:#fff9ee;border-radius:7px;padding:11px;margin-top:13px}.history{width:100%;border-collapse:collapse}.history td,.history th{padding:11px;border-bottom:1px solid #e9edf4;text-align:left;font-size:13px}.history th{color:#687b95}.notice{font-size:13px;color:#8a642a}.empty{text-align:center;padding:40px;color:#7a889c}.toggle{display:inline-flex;gap:7px;align-items:center;font-size:13px}.divider{border-top:1px solid #e7ecf4;margin:17px 0}.footer{text-align:center;color:#8592a5;font-size:12px;margin:26px 0}.mini{padding:6px 9px;font-size:12px}.status-good{color:#167a4c}.status-bad{color:#c04b4b}h1{margin:6px 0 10px;font-size:27px}h2{margin:8px 0 12px;font-size:21px}h3{font-size:16px}p{line-height:1.6}.sectionbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0}input[type=file]{display:none}@media(max-width:760px){.wrap{padding:13px}.grid{grid-template-columns:repeat(2,1fr)}.chapter-grid{grid-template-columns:1fr}.panel{padding:16px}.question{font-size:18px}.brand{font-size:19px}.header{align-items:flex-start}.nav button{padding:8px 10px;font-size:13px}}

const BANK=[{"id":"Corrosives-1","section":"Corrosives","number":1,"en":"Corrosive chemicals are harmful to:","zh":"腐蚀性化学品会对什么造成伤害？","options":[{"key":"A","en":"mental health.","zh":"心理健康"},{"key":"B","en":"tissue.","zh":"人体组织"},{"key":"C","en":"steel.","zh":"钢铁"}],"answer":"B"},{"id":"Corrosives-2","section":"Corrosives","number":2,"en":"Other hazards that corrosives cover include:","zh":"腐蚀性化学品还可能具有哪些其他危险？","options":[{"key":"A","en":"reactivity and instability.","zh":"反应性和不稳定性"},{"key":"B","en":"instability and self-polymerization.","zh":"不稳定性和自聚合"},{"key":"C","en":"flammability and toxicity.","zh":"易燃性和毒性"},{"key":"D","en":"ignitability and toxicity.","zh":"易点燃性和毒性"}],"answer":"A"},{"id":"Corrosives-3","section":"Corrosives","number":3,"en":"The most common hazard of corrosives in the laboratory is:","zh":"实验室中腐蚀性物质最常见的危险是什么？","options":[{"key":"A","en":"release of hydrogen in reaction with metals.","zh":"与金属反应释放氢气"},{"key":"B","en":"instability.","zh":"不稳定性"},{"key":"C","en":"tissue destruction.","zh":"组织损伤"},{"key":"D","en":"corrosion of plastic containers.","zh":"腐蚀塑料容器"}],"answer":"C"},{"id":"Corrosives-4","section":"Corrosives","number":4,"en":"Corrosive chemicals include:","zh":"腐蚀性化学品包括：","options":[{"key":"A","en":"acids and bases.","zh":"酸和碱"},{"key":"B","en":"phenols, hydrides, amines.","zh":"酚类、氢化物和胺类"},{"key":"C","en":"thinner, rust, amines.","zh":"稀释剂、铁锈和胺类"}],"answer":"A"},{"id":"Corrosives-5","section":"Corrosives","number":5,"en":"Protein barriers are developed with acid contact of tissue with the exception of which acid?","zh":"酸与人体组织接触时通常会形成蛋白质屏障，以下哪种酸属于例外？","options":[{"key":"A","en":"nitric acid","zh":"硝酸"},{"key":"B","en":"acetic acid","zh":"乙酸"},{"key":"C","en":"sulfuric acid","zh":"硫酸"},{"key":"D","en":"hydrochloric acid","zh":"盐酸"}],"answer":"C"},{"id":"Corrosives-6","section":"Corrosives","number":6,"en":"Bases create an insidious hazard because:","zh":"碱性物质为什么会造成不易察觉的危险？","options":[{"key":"A","en":"they are not soluble in water.","zh":"它们不溶于水"},{"key":"B","en":"they do not create a protein barrier.","zh":"它们不会形成蛋白质屏障"},{"key":"C","en":"their soapy feel does not wash away.","zh":"它们的肥皂般滑腻感无法洗掉"}],"answer":"B"},{"id":"Corrosives-7","section":"Corrosives","number":7,"en":"Two chemical properties that determine the rate of burn of a corrosive are:","zh":"决定腐蚀性物质造成化学灼伤速度的两个化学性质是：","options":[{"key":"A","en":"strength and degree of ionization.","zh":"强度和电离程度"},{"key":"B","en":"strength and concentration.","zh":"强度和浓度"},{"key":"C","en":"strength and physical state.","zh":"强度和物理状态"},{"key":"D","en":"strength and pH.","zh":"强度和 pH 值"}],"answer":"B"},{"id":"Corrosives-8","section":"Corrosives","number":8,"en":"The pH of a corrosive is dependent on:","zh":"腐蚀性物质的 pH 值取决于：","options":[{"key":"A","en":"user technique.","zh":"使用者的操作技术"},{"key":"B","en":"degree of ionization and concentration.","zh":"电离程度和浓度"},{"key":"C","en":"container material.","zh":"容器材料"},{"key":"D","en":"temperature and age.","zh":"温度和存放时间"}],"answer":"B"},{"id":"Corrosives-9","section":"Corrosives","number":9,"en":"The stronger and more concentrated the corrosive, the ______ the hazard.","zh":"腐蚀性物质的强度和浓度越高，其危险性就越______。","options":[{"key":"A","en":"greater","zh":"大"},{"key":"B","en":"lesser","zh":"小"},{"key":"C","en":"it makes no difference.","zh":"没有区别"}],"answer":"A"},{"id":"Corrosives-10","section":"Corrosives","number":10,"en":"Inhalation of corrosive vapors can cause:","zh":"吸入腐蚀性蒸气可能导致：","options":[{"key":"A","en":"vomiting.","zh":"呕吐"},{"key":"B","en":"swelling of the throat.","zh":"喉咙肿胀"},{"key":"C","en":"irritation of the mucous linings.","zh":"黏膜刺激"},{"key":"D","en":"pain in swallowing.","zh":"吞咽疼痛"}],"answer":"C"},{"id":"Corrosives-11","section":"Corrosives","number":11,"en":"First aid for ingestion of corrosives should never include what?","zh":"误食腐蚀性物质后的急救措施绝不应该包括什么？","options":[{"key":"A","en":"a trip to the emergency room","zh":"前往急诊室"},{"key":"B","en":"vomiting.","zh":"催吐"},{"key":"C","en":"ingestion of baking soda.","zh":"服用小苏打"},{"key":"D","en":"drinking a lot of water.","zh":"大量饮水"}],"answer":"B"},{"id":"Corrosives-12","section":"Corrosives","number":12,"en":"Which organ is particularly vulnerable to corrosive injury?","zh":"哪个器官特别容易受到腐蚀性物质的伤害？","options":[{"key":"A","en":"lungs","zh":"肺"},{"key":"B","en":"skin.","zh":"皮肤"},{"key":"C","en":"stomach.","zh":"胃"},{"key":"D","en":"eyes.","zh":"眼睛"}],"answer":"D"},{"id":"Corrosives-13","section":"Corrosives","number":13,"en":"Which material corrosion scenarios are found in laboratories?","zh":"实验室中可能出现哪些材料腐蚀情况？","options":[{"key":"A","en":"plumbing.","zh":"管道系统"},{"key":"B","en":"shelving.","zh":"储物架"},{"key":"C","en":"containers.","zh":"容器"},{"key":"D","en":"all the above.","zh":"以上全部"}],"answer":"D"},{"id":"Corrosives-14","section":"Corrosives","number":14,"en":"Hydrogen evolution is hazardous in a laboratory due to:","zh":"实验室中释放氢气会造成危险，原因是：","options":[{"key":"A","en":"increased container pressurization.","zh":"容器内部压力升高"},{"key":"B","en":"oxygen displacement","zh":"氧气被置换"},{"key":"C","en":"reaction with oxidizing materials.","zh":"与氧化性物质发生反应"},{"key":"D","en":"both a. and c.","zh":"A 和 C 均正确"}],"answer":"D"},{"id":"Corrosives-15","section":"Corrosives","number":15,"en":"Corrosive materials are known to be reactive with only:","zh":"已知腐蚀性物质只会与以下哪类物质发生反应？","options":[{"key":"A","en":"flammables.","zh":"易燃物"},{"key":"B","en":"metals.","zh":"金属"},{"key":"C","en":"toxic materials.","zh":"有毒物质"},{"key":"D","en":"none of the above.","zh":"以上均不正确"}],"answer":"D"},{"id":"Corrosives-16","section":"Corrosives","number":16,"en":"The most common mineral acids are also:","zh":"最常见的无机酸还具有以下哪种性质？","options":[{"key":"A","en":"flammable.","zh":"易燃性"},{"key":"B","en":"oxidizers.","zh":"氧化性物质"},{"key":"C","en":"dehydrating agents.","zh":"脱水剂"},{"key":"D","en":"exothermic.","zh":"放热性"}],"answer":"B"},{"id":"Corrosives-17","section":"Corrosives","number":17,"en":"Dehydration refers to:","zh":"脱水作用是指：","options":[{"key":"A","en":"not drinking water for hours.","zh":"数小时不喝水"},{"key":"B","en":"the ability to repel water.","zh":"排斥水的能力"},{"key":"C","en":"pulling water from the air and incorporating it into the chemical structure.","zh":"从空气中吸收水分并将其纳入化学结构"},{"key":"D","en":"a strong affinity for water.","zh":"对水具有很强的亲和力"}],"answer":"D"},{"id":"Corrosives-18","section":"Corrosives","number":18,"en":"Toxicity of corrosives:","zh":"关于腐蚀性物质的毒性：","options":[{"key":"A","en":"has never been considered.","zh":"从未被考虑过"},{"key":"B","en":"may be deadly at low concentrations.","zh":"即使在低浓度下也可能致命"},{"key":"C","en":"is never covered in Material Safety Data Sheets.","zh":"从未在材料安全数据表中说明"},{"key":"D","en":"is insignificant and so toxicity need never be considered.","zh":"毒性不重要，因此无需考虑"}],"answer":"B"},{"id":"Corrosives-19","section":"Corrosives","number":19,"en":"Corrosives may have ______ of the hazard characteristics.","zh":"腐蚀性物质可能同时具有______危险特性。","options":[{"key":"A","en":"one or more","zh":"一种或多种"},{"key":"B","en":"only one at a time.","zh":"每次只有一种"},{"key":"C","en":"none.","zh":"没有"},{"key":"D","en":"at most two.","zh":"最多两种"}],"answer":"A"},{"id":"Corrosives-20","section":"Corrosives","number":20,"en":"Perchloric acid is explosive due to:","zh":"高氯酸具有爆炸危险的原因是：","options":[{"key":"A","en":"concentration.","zh":"浓度"},{"key":"B","en":"reaction with organic materials.","zh":"与有机物发生反应"},{"key":"C","en":"heat.","zh":"热量"},{"key":"D","en":"a. and b.","zh":"A 和 B 均正确"}],"answer":"D"},{"id":"Corrosives-21","section":"Corrosives","number":21,"en":"Corrosives should be stored:","zh":"腐蚀性物质应该如何储存？","options":[{"key":"A","en":"separate from incompatibles.","zh":"与不相容的化学品分开存放"},{"key":"B","en":"below eye level.","zh":"存放在低于眼睛高度的位置"},{"key":"C","en":"in wooden cabinets or corrosion-resistant materials.","zh":"存放在木制柜或耐腐蚀材料制成的柜中"},{"key":"D","en":"all the above.","zh":"以上全部"}],"answer":"D"},{"id":"Corrosives-22","section":"Corrosives","number":22,"en":"Which rule should be followed when mixing acids and water?","zh":"混合酸和水时应遵循哪项规则？","options":[{"key":"A","en":"Mix acid and water in equal amounts.","zh":"将等量的酸和水混合"},{"key":"B","en":"Mix acid and water remotely.","zh":"远程操作混合酸和水"},{"key":"C","en":"Add water to acid.","zh":"将水加入酸中"},{"key":"D","en":"Add acid to water.","zh":"将酸加入水中"}],"answer":"D"},{"id":"Corrosives-23","section":"Corrosives","number":23,"en":"Face shields should be used:","zh":"面部防护罩应该如何使用？","options":[{"key":"A","en":"instead of instead of eye protection.","zh":"代替眼部防护用品（原题存在重复用词）"},{"key":"B","en":"every time corrosives are mixed.","zh":"每次混合腐蚀性物质时"},{"key":"C","en":"if a supervisor is not present.","zh":"当主管不在场时"},{"key":"D","en":"with eye protection every time it is worn.","zh":"每次佩戴面罩时，都应同时佩戴眼部防护用品"}],"answer":"D"},{"id":"Corrosives-24","section":"Corrosives","number":24,"en":"What is the proper first aid for every exposure to corrosives?","zh":"接触腐蚀性物质时，普遍适用的急救措施是什么？","options":[{"key":"A","en":"neutralize the corrosive on the skin.","zh":"在皮肤上中和腐蚀性物质"},{"key":"B","en":"wash with voluminous amounts of water.","zh":"使用大量清水冲洗"},{"key":"C","en":"get fresh air","zh":"呼吸新鲜空气"},{"key":"D","en":"seek emergency medical care.","zh":"寻求紧急医疗救助"}],"answer":"B"},{"id":"Corrosives-25","section":"Corrosives","number":25,"en":"Secondary containment refers to:","zh":"二次围堵（第二层泄漏防护）是指：","options":[{"key":"A","en":"another container of the material available in case the first breaks.","zh":"准备另一个装有相同材料的容器，以防第一个容器破裂"},{"key":"B","en":"bucket or trays used to catch leaking material from the primary container.","zh":"使用桶或托盘收集从主容器泄漏的物质"},{"key":"C","en":"an inferior container.","zh":"质量较差的容器"},{"key":"D","en":"transportation devices","zh":"运输装置"}],"answer":"B"},{"id":"Flammables-1","section":"Flammables","number":1,"en":"The chemical reaction of fire is defined as:","zh":"燃烧的化学反应定义为：","options":[{"key":"A","en":"a hazardous interaction of air and fuel.","zh":"空气与燃料之间的危险相互作用"},{"key":"B","en":"an ignited oxidation-reduction.","zh":"被点燃的氧化还原反应"},{"key":"C","en":"a self-sustaining, exothermic, rapid oxidation.","zh":"自我维持、放热的快速氧化反应"},{"key":"D","en":"a Lewis Acid reaction.","zh":"路易斯酸反应"}],"answer":"D"},{"id":"Flammables-2","section":"Flammables","number":2,"en":"The fire triangle is composed of:","zh":"燃烧三角形由哪些要素组成？","options":[{"key":"A","en":"fuel, air, and proportioning.","zh":"燃料、空气和适当比例"},{"key":"B","en":"heat, mixing and air.","zh":"热量、混合和空气"},{"key":"C","en":"fuel, air and heat.","zh":"燃料、空气和热量"}],"answer":"C"},{"id":"Flammables-3","section":"Flammables","number":3,"en":"An oxidizer in a fire may be:","zh":"火灾中的氧化剂可能是：","options":[{"key":"A","en":"Sodium.","zh":"钠"},{"key":"B","en":"Chlorine.","zh":"氯气"},{"key":"C","en":"Phosphorus.","zh":"磷"}],"answer":"B"},{"id":"Flammables-4","section":"Flammables","number":4,"en":"The fourth leg of a fire was discovered:","zh":"燃烧四面体中的第四个要素是如何确定的？","options":[{"key":"A","en":"after studying the physical nature of fires.","zh":"通过研究火灾的物理性质"},{"key":"B","en":"by applying different gases to fires.","zh":"通过向火焰施加不同气体"},{"key":"C","en":"to include an uninhibited chain reaction.","zh":"为了将未受抑制的链式反应纳入燃烧模型"},{"key":"D","en":"to limit the role of the reducer.","zh":"为了限制还原剂的作用"}],"answer":"C"},{"id":"Flammables-5","section":"Flammables","number":5,"en":"The fire cycle explains the chemical reaction of fire by showing that:","zh":"燃烧循环通过说明以下哪一点来解释燃烧的化学反应？","options":[{"key":"A","en":"a correct number of molecules must contact each other to cause a self-sustaining reaction.","zh":"必须有适当数量的分子相互接触，才能产生自我维持的反应"},{"key":"B","en":"proportioning is a minor consideration.","zh":"物质比例是次要因素"},{"key":"C","en":"liquids and solids are the important physical state to consider.","zh":"液体和固体是需要考虑的重要物理状态"},{"key":"D","en":"ignition is less important than previously determined.","zh":"点火的重要性低于此前的认识"}],"answer":"A"},{"id":"Flammables-6","section":"Flammables","number":6,"en":"Vapors are the physical state to consider in fires because:","zh":"在火灾中需要特别考虑蒸气状态，因为：","options":[{"key":"A","en":"when air burns, it is difficult to extinguish.","zh":"当空气燃烧时，很难将其扑灭"},{"key":"B","en":"the gaseous state is usually invisible.","zh":"气态物质通常不可见"},{"key":"C","en":"fire extinguishers are ineffective against vapor fires.","zh":"灭火器对蒸气火灾无效"},{"key":"D","en":"the molecules are mixing most efficiently, leading to the proper proportioning.","zh":"分子能够高效混合，从而达到适当的反应比例"}],"answer":"D"},{"id":"Flammables-7","section":"Flammables","number":7,"en":"Flash point is the temperature at which:","zh":"闪点是指达到以下哪种情况时的温度？","options":[{"key":"A","en":"the solid or liquid will sustain a flame when an ignition source is introduced.","zh":"固体或液体在引入点火源后能够持续燃烧"},{"key":"B","en":"the solid will flash when a flame is introduced.","zh":"固体在接触火焰时发生闪燃"},{"key":"C","en":"the vapors will flash when a flame is introduced.","zh":"蒸气在接触火焰时发生闪燃"}],"answer":"C"},{"id":"Flammables-8","section":"Flammables","number":8,"en":"Which temperature is the most commonly used relative indicator of flammability?","zh":"哪一种温度最常被用作衡量易燃性的相对指标？","options":[{"key":"A","en":"flash point","zh":"闪点"},{"key":"B","en":"self-ignition temperature","zh":"自燃温度"},{"key":"C","en":"melting point","zh":"熔点"}],"answer":"A"},{"id":"Flammables-9","section":"Flammables","number":9,"en":"Combustibility is distinguished from flammability by which properties?","zh":"可燃性与易燃性通常通过哪些性质加以区分？","options":[{"key":"A","en":"melting point and vapor pressure","zh":"熔点和蒸气压"},{"key":"B","en":"vapor pressure and flash point","zh":"蒸气压和闪点"},{"key":"C","en":"flash point and boiling point","zh":"闪点和沸点"},{"key":"D","en":"flash point and specific gravity","zh":"闪点和比重"}],"answer":"C"},{"id":"Flammables-10","section":"Flammables","number":10,"en":"Vapor density:","zh":"关于蒸气密度：","options":[{"key":"A","en":"gives a clue as to where to look for vapors that might ignite.","zh":"有助于判断可能被点燃的蒸气会聚集在哪里"},{"key":"B","en":"gives a clue as to how corrosive the vapors might be.","zh":"有助于判断蒸气的腐蚀性"},{"key":"C","en":"is unimportant because vapors travel wherever they please.","zh":"并不重要，因为蒸气可以随意扩散"},{"key":"D","en":"compares the density of a compound to pure oxygen.","zh":"将化合物的密度与纯氧进行比较"}],"answer":"A"},{"id":"Flammables-11","section":"Flammables","number":11,"en":"Self-piloted ignition:","zh":"自发点燃（原题用语：Self-piloted ignition）：","options":[{"key":"A","en":"starts from common sources such as light-bulbs or outlets.","zh":"由灯泡或电源插座等常见点火源引起"},{"key":"B","en":"refers to the temperature at which a vapor will ignite without an external source.","zh":"指蒸气无需外部点火源即可点燃的温度"},{"key":"C","en":"refers to the temperature at which vapors will ignite from the pressure in the container.","zh":"指蒸气因容器内压力而点燃的温度"}],"answer":"B"},{"id":"Flammables-12","section":"Flammables","number":12,"en":"A flammable storage cabinet will protect its contents from a fire:","zh":"易燃物储存柜能够在火灾中保护其内部物品：","options":[{"key":"A","en":"due to an internal fire suppression system.","zh":"因为柜内装有灭火系统"},{"key":"B","en":"for one hour.","zh":"持续一小时"},{"key":"C","en":"only if the door is latched shut.","zh":"只有柜门锁紧时"},{"key":"D","en":"until the fire external to the cabinet is extinguished.","zh":"直到柜外火灾被扑灭"}],"answer":"B"},{"id":"Flammables-13","section":"Flammables","number":13,"en":"Venting of a flammable storage cabinet:","zh":"关于易燃物储存柜的通风：","options":[{"key":"A","en":"will help eliminate vapors that could be involved in a fire.","zh":"有助于排除可能参与燃烧的蒸气"},{"key":"B","en":"should only be performed by certified technicians.","zh":"只能由经过认证的技术人员进行"},{"key":"C","en":"must meet fire safety codes.","zh":"必须符合消防安全规范"},{"key":"D","en":"will add additional oxygen to feed a fire.","zh":"会增加氧气供应并助长火势"}],"answer":"C"},{"id":"Flammables-14","section":"Flammables","number":14,"en":"Incompatible chemicals:","zh":"关于不相容的化学品：","options":[{"key":"A","en":"will never mix because the containers are reliable.","zh":"因为容器可靠，所以它们永远不会混合"},{"key":"B","en":"stored in a flammable storage cabinet will limit the fire to the cabinet.","zh":"存放在易燃物储存柜中可以将火灾限制在柜内"},{"key":"C","en":"must only be stored in freezers.","zh":"只能存放在冰箱中"},{"key":"D","en":"could start a fire when stored together.","zh":"放在一起储存可能引发火灾"}],"answer":"D"},{"id":"Flammables-15","section":"Flammables","number":15,"en":"The proper temperature to store flammables in:","zh":"储存易燃物的适当温度：","options":[{"key":"A","en":"is found in household refrigerators.","zh":"是家用冰箱中的温度"},{"key":"B","en":"is usually room temperature.","zh":"通常是室温"},{"key":"C","en":"should be cool.","zh":"应保持凉爽"}],"answer":"C"},{"id":"Flammables-16","section":"Flammables","number":16,"en":"Cool storage of flammables:","zh":"关于易燃物的低温储存：","options":[{"key":"A","en":"must be in refrigerators designated for explosion proof storage.","zh":"必须使用专门用于防爆储存的冰箱"},{"key":"B","en":"must be in refrigerators designated for flammable storage.","zh":"必须使用专门用于储存易燃物的冰箱"},{"key":"C","en":"is an impossibility.","zh":"不可能实现"},{"key":"D","en":"must be in refrigerators designated by the chemical hygiene officer.","zh":"必须使用由化学安全负责人指定的冰箱"}],"answer":"B"},{"id":"Flammables-17","section":"Flammables","number":17,"en":"Potential ignition sources include:","zh":"潜在的点火源包括：","options":[{"key":"A","en":"telephones, light switches, burners.","zh":"电话、灯光开关、燃烧器"},{"key":"B","en":"equipment switches, light bulbs, static electricity.","zh":"设备开关、灯泡、静电"},{"key":"C","en":"open flames, outlets, hot plates.","zh":"明火、电源插座、加热板"},{"key":"D","en":"All the Above","zh":"以上全部"}],"answer":"D"},{"id":"Flammables-18","section":"Flammables","number":18,"en":"Good housekeeping for preventing a fire might include:","zh":"有助于预防火灾的良好实验室管理措施包括：","options":[{"key":"A","en":"keeping chemicals stored outside.","zh":"将化学品储存在室外"},{"key":"B","en":"putting the lids on chemical containers.","zh":"盖紧化学品容器的盖子"},{"key":"C","en":"storing chemicals in alphabetical order.","zh":"按字母顺序储存化学品"},{"key":"D","en":"use no electricity in the laboratory.","zh":"实验室内完全不使用电力"}],"answer":"B"},{"id":"Flammables-19","section":"Flammables","number":19,"en":"Activated charcoal is a good absorbent for flammable liquids because:","zh":"活性炭适合用于处理易燃液体的原因是：","options":[{"key":"A","en":"the black color indicates where the liquid is.","zh":"黑色有助于显示液体的位置"},{"key":"B","en":"it retains the vapors.","zh":"它能够吸附并保留蒸气"},{"key":"C","en":"it is cheap.","zh":"它价格便宜"},{"key":"D","en":"it can be disposed to a sanitary landfill.","zh":"它可以直接丢弃到普通垃圾填埋场"}],"answer":"B"},{"id":"Flammables-20","section":"Flammables","number":20,"en":"A class B fire references a fire in which the fuel is:","zh":"B 类火灾是指燃料为以下哪种物质的火灾？","options":[{"key":"A","en":"chemical solvents.","zh":"化学溶剂"},{"key":"B","en":"combustible metals.","zh":"可燃金属"},{"key":"C","en":"electrical equipment.","zh":"电气设备"},{"key":"D","en":"ordinary combustibles such as wood, fabric and paper.","zh":"木材、织物和纸张等普通可燃物"}],"answer":"A"},{"id":"Flammables-21","section":"Flammables","number":21,"en":"The most commonly available extinguishing agent is:","zh":"最常见、最容易获得的灭火介质是：","options":[{"key":"A","en":"dirt.","zh":"泥土"},{"key":"B","en":"sheetrock.","zh":"石膏板"},{"key":"C","en":"water.","zh":"水"},{"key":"D","en":"air.","zh":"空气"}],"answer":"C"},{"id":"Flammables-22","section":"Flammables","number":22,"en":"Most fire extinguishers are designed to last:","zh":"大多数灭火器设计的持续喷射时间为：","options":[{"key":"A","en":"about 2 minutes.","zh":"大约 2 分钟"},{"key":"B","en":"just until the user can escape.","zh":"仅够使用者逃生"},{"key":"C","en":"about 30 seconds","zh":"大约 30 秒"},{"key":"D","en":"long enough to extinguish the most common fires.","zh":"足够扑灭最常见的火灾"}],"answer":"C"},{"id":"Flammables-23","section":"Flammables","number":23,"en":"The point in the fire to aim the extinguisher is:","zh":"使用灭火器时，应将喷嘴对准火焰的哪个位置？","options":[{"key":"A","en":"at the top of the flame.","zh":"火焰顶部"},{"key":"B","en":"into the middle of the flame.","zh":"火焰中部"},{"key":"C","en":"around the outside of the fuel.","zh":"燃料外围"},{"key":"D","en":"at the base of the flame.","zh":"火焰根部"}],"answer":"D"},{"id":"Flammables-24","section":"Flammables","number":24,"en":"Knowledge of fire models:","zh":"了解燃烧模型：","options":[{"key":"A","en":"created an excuse for grant money.","zh":"只是为了申请研究经费而制造的借口"},{"key":"B","en":"is useless trivia.","zh":"是没有用处的琐碎知识"},{"key":"C","en":"is a fun diversion for an afternoon.","zh":"只是下午消遣的有趣活动"},{"key":"D","en":"can help prevent a fire.","zh":"可以帮助预防火灾"}],"answer":"D"},{"id":"Flammables-25","section":"Flammables","number":25,"en":"Flammable materials which are spilled should be cleaned:","zh":"易燃物质发生泄漏时，应该如何清理？","options":[{"key":"A","en":"only after evacuating all building personnel.","zh":"只有在疏散建筑物内所有人员后才能清理"},{"key":"B","en":"within one hour.","zh":"在一小时内清理"},{"key":"C","en":"only by professionals.","zh":"只能由专业人员清理"},{"key":"D","en":"quickly, after assessing the level of danger","zh":"评估危险程度后迅速清理"}],"answer":"D"},{"id":"Fume Hoods-1","section":"Fume Hoods","number":1,"en":"The primary means of protection against inhalation of hazardous chemicals in a laboratory is:","zh":"实验室中防止吸入危险化学品的主要防护措施是：","options":[{"key":"A","en":"the fume hood.","zh":"化学通风橱"},{"key":"B","en":"variable air volume ventilation.","zh":"变风量通风系统"},{"key":"C","en":"a respirator.","zh":"呼吸防护器"},{"key":"D","en":"building ventilation.","zh":"建筑物通风系统"}],"answer":"A"},{"id":"Fume Hoods-2","section":"Fume Hoods","number":2,"en":"A fume hood is:","zh":"化学通风橱是：","options":[{"key":"A","en":"a laminar flow hood.","zh":"层流工作台"},{"key":"B","en":"a biological safety cabinet.","zh":"生物安全柜"},{"key":"C","en":"a respirator.","zh":"呼吸防护器"},{"key":"D","en":"a piece of safety equipment.","zh":"一种安全防护设备"}],"answer":"D"},{"id":"Fume Hoods-3","section":"Fume Hoods","number":3,"en":"Two items critical to proper fume hood function are:","zh":"确保化学通风橱正常发挥作用的两个关键因素是：","options":[{"key":"A","en":"user practices and hood design.","zh":"使用者的操作规范和通风橱设计"},{"key":"B","en":"ventilation rate and user practices.","zh":"通风速率和使用者的操作规范"},{"key":"C","en":"ventilation rate and hood design.","zh":"通风速率和通风橱设计"},{"key":"D","en":"user practices and ventilation rate.","zh":"使用者的操作规范和通风速率"}],"answer":"A"},{"id":"Fume Hoods-4","section":"Fume Hoods","number":4,"en":"An advantage to using conventional fume hoods is that:","zh":"使用传统型化学通风橱的一个优点是：","options":[{"key":"A","en":"the sash will act as an explosion shield.","zh":"通风橱前窗可充当防爆屏障"},{"key":"B","en":"the velocity of air moves through the louvers and the sash opening.","zh":"空气通过百叶通风口和前窗开口流动"},{"key":"C","en":"the velocity of the air moving through the hood increases as the sash is raised.","zh":"当前窗升高时，通风橱内的气流速度增加"},{"key":"D","en":"the velocity of the air moving through the hood increases as the sash is lowered.","zh":"当前窗降低时，通风橱内的气流速度增加"}],"answer":"D"},{"id":"Fume Hoods-5","section":"Fume Hoods","number":5,"en":"An advantage to using by-pass fume hoods is that:","zh":"使用旁通式化学通风橱的一个优点是：","options":[{"key":"A","en":"the velocity of the air moving through the hood increases as the sash is raised.","zh":"当前窗升高时，气流速度增加"},{"key":"B","en":"the velocity of the air moving through the hood increases as the sash is lowered.","zh":"当前窗降低时，气流速度增加"},{"key":"C","en":"the sash will act as an explosion shield.","zh":"前窗可充当防爆屏障"},{"key":"D","en":"the velocity of the air moves through the louvers and the sash opening.","zh":"空气通过百叶通风口和前窗开口流动"}],"answer":"D"},{"id":"Fume Hoods-6","section":"Fume Hoods","number":6,"en":"An advantage to using the auxiliary air hoods (a.k.a. supplied-air hoods) is that:","zh":"使用辅助送风式通风橱（也称补风式通风橱）的优点是：","options":[{"key":"A","en":"the velocity of the air moving through the hood increases as the sash is raised.","zh":"当前窗升高时，气流速度增加"},{"key":"B","en":"the velocity of the air moves through the louvers and the sash opening.","zh":"空气通过百叶通风口和前窗开口流动"},{"key":"C","en":"energy savings are realized.","zh":"可以节约能源"},{"key":"D","en":"the velocity of the air moving through the hood increases as the sash is lowered.","zh":"当前窗降低时，气流速度增加"}],"answer":"C"},{"id":"Fume Hoods-7","section":"Fume Hoods","number":7,"en":"Perchloric acid hoods must be used under what circumstances?","zh":"在什么情况下必须使用专用高氯酸通风橱？","options":[{"key":"A","en":"when perchloric acid is poured in the hood.","zh":"当在通风橱内倾倒高氯酸时"},{"key":"B","en":"when perchloric acid is poured down the drain of a hood.","zh":"当高氯酸被倒入通风橱排水口时"},{"key":"C","en":"when perchloric acid is stored in the hood.","zh":"当高氯酸储存在通风橱内时"},{"key":"D","en":"when perchloric acid is used above ambient temperatures in the hood.","zh":"当高氯酸在高于环境温度的条件下使用时"}],"answer":"D"},{"id":"Fume Hoods-8","section":"Fume Hoods","number":8,"en":"An advantage of walk-in hoods is that:","zh":"步入式通风橱的一个优点是：","options":[{"key":"A","en":"an employee may walk into the hood to check the flow of air.","zh":"工作人员可以进入通风橱检查气流"},{"key":"B","en":"an employee may walk into the hood to check on experiments.","zh":"工作人员可以进入通风橱检查实验"},{"key":"C","en":"an employee may walk into the hood to set up the equipment.","zh":"工作人员可以进入通风橱安装和布置设备"},{"key":"D","en":"an employee may walk into the hood to deal with hazardous waste.","zh":"工作人员可以进入通风橱处理危险废物"}],"answer":"C"},{"id":"Fume Hoods-9","section":"Fume Hoods","number":9,"en":"An acceptable alternative to a fume hood when better protection is needed is:","zh":"当需要比普通化学通风橱更高等级的防护时，可以使用：","options":[{"key":"A","en":"a glove box.","zh":"手套箱"},{"key":"B","en":"faster flow of air through the hood.","zh":"提高通风橱的气流速度"},{"key":"C","en":"a respirator.","zh":"呼吸防护器"},{"key":"D","en":"self-contained breathing apparatus.","zh":"自给式呼吸器"}],"answer":"A"},{"id":"Fume Hoods-10","section":"Fume Hoods","number":10,"en":"Air foils facilitate:","zh":"导流翼（Air foils）的作用是：","options":[{"key":"A","en":"pressure differentials that suck air into the hood faster.","zh":"产生压力差，使空气更快进入通风橱"},{"key":"B","en":"air curtains that prevent air from spilling out of the hood.","zh":"形成气幕，防止空气从通风橱逸出"},{"key":"C","en":"smoother flow of air into the hood.","zh":"使空气更平稳地流入通风橱"},{"key":"D","en":"barriers to air reversals.","zh":"形成防止气流逆转的屏障"}],"answer":"C"},{"id":"Fume Hoods-11","section":"Fume Hoods","number":11,"en":"Contaminated air exits the hood through the:","zh":"受污染的空气通过通风橱的哪个部分排出？","options":[{"key":"A","en":"plenum.","zh":"静压箱"},{"key":"B","en":"sash opening.","zh":"前窗开口"},{"key":"C","en":"louvers.","zh":"百叶通风口"},{"key":"D","en":"baffles.","zh":"导流挡板"}],"answer":"D"},{"id":"Fume Hoods-12","section":"Fume Hoods","number":12,"en":"Baffles are located at the top and bottom of the hood to accommodate differences in:","zh":"通风橱顶部和底部设置导流挡板，是为了适应以下哪种差异？","options":[{"key":"A","en":"specific gravity.","zh":"比重"},{"key":"B","en":"flash point.","zh":"闪点"},{"key":"C","en":"pH.","zh":"酸碱度"},{"key":"D","en":"vapor density.","zh":"蒸气密度"}],"answer":"D"},{"id":"Fume Hoods-13","section":"Fume Hoods","number":13,"en":"Why is turbulence in the hood to be avoided?","zh":"为什么应避免通风橱内产生湍流？","options":[{"key":"A","en":"Turbulence will sweep dirt and contamination into the fume hood.","zh":"湍流会将灰尘和污染物带入通风橱"},{"key":"B","en":"Turbulence will cause contaminated air to spill out of the hood.","zh":"湍流可能导致受污染的空气从通风橱逸出"},{"key":"C","en":"Turbulence may cause insufficient velocity to exit the hood.","zh":"湍流可能导致排出通风橱的气流速度不足"},{"key":"D","en":"Turbulence can sweep trash into the ductwork.","zh":"湍流可能将垃圾带入排风管道"}],"answer":"B"},{"id":"Fume Hoods-14","section":"Fume Hoods","number":14,"en":"Current thought gives the safe velocity range for a fume hood between:","zh":"根据原题所采用的标准，化学通风橱的安全气流速度范围为：","options":[{"key":"A","en":"75–120 miles/hr.","zh":"75–120 英里/小时"},{"key":"B","en":"100–150 ft./sec.","zh":"100–150 英尺/秒"},{"key":"C","en":"100–150 miles/hr.","zh":"100–150 英里/小时"},{"key":"D","en":"80–120 ft./sec.","zh":"80–120 英尺/秒"}],"answer":"D"},{"id":"Fume Hoods-15","section":"Fume Hoods","number":15,"en":"The sash may be used:","zh":"通风橱的前窗（Sash）可以用于：","options":[{"key":"A","en":"to increase the volume of air entering the hood.","zh":"增加进入通风橱的空气总量"},{"key":"B","en":"as an explosion shield.","zh":"作为防爆屏障"},{"key":"C","en":"to increase the velocity of air entering the hood.","zh":"增加进入通风橱的气流速度"},{"key":"D","en":"as a barrier to putting the head inside the hood.","zh":"作为防止头部伸入通风橱的屏障"}],"answer":"C"},{"id":"Fume Hoods-16","section":"Fume Hoods","number":16,"en":"The hood is effective if:","zh":"在以下哪种情况下，通风橱能够有效发挥作用？","options":[{"key":"A","en":"It is used.","zh":"使用了通风橱"},{"key":"B","en":"Flammable storage cabinets are vented into it.","zh":"易燃物储存柜的排气接入通风橱"},{"key":"C","en":"it is used for storage.","zh":"将通风橱用作储物柜"},{"key":"D","en":"The employee monitors the flow while it is used.","zh":"使用过程中，工作人员持续监测气流状况"}],"answer":"A"},{"id":"Fume Hoods-17","section":"Fume Hoods","number":17,"en":"How far back (at the least) from the face of the hood should operations be located?","zh":"实验操作位置至少应距离通风橱前缘多远？","options":[{"key":"A","en":"12 inches.","zh":"12 英寸（约 30.5 cm）"},{"key":"B","en":"9 inches.","zh":"9 英寸（约 22.9 cm）"},{"key":"C","en":"6 inches.","zh":"6 英寸（约 15.2 cm）"},{"key":"D","en":"3 inches.","zh":"3 英寸（约 7.6 cm）"}],"answer":"C"},{"id":"Fume Hoods-18","section":"Fume Hoods","number":18,"en":"The reason bottles should not be stored in a hood is because:","zh":"不应将化学试剂瓶长期存放在通风橱中的原因是：","options":[{"key":"A","en":"they might have incompatible contents.","zh":"瓶内可能装有相互不相容的化学品"},{"key":"B","en":"they might explode in a hood damaging the liners.","zh":"试剂瓶可能在通风橱内爆炸并损坏内衬"},{"key":"C","en":"they might contaminate operations occurring in the hood.","zh":"试剂瓶可能污染通风橱内正在进行的实验"},{"key":"D","en":"they block the flow of air to the baffles.","zh":"它们会阻碍空气流向导流挡板"}],"answer":"D"},{"id":"Fume Hoods-19","section":"Fume Hoods","number":19,"en":"Air velocity greater than 120 ft./sec.:","zh":"当气流速度超过 120 英尺/秒时：","options":[{"key":"A","en":"Is too great to avoid obstructions in the hood.","zh":"气流速度过大，无法避免通风橱内障碍物的影响"},{"key":"B","en":"may create turbulence within the hood.","zh":"可能在通风橱内产生湍流"},{"key":"C","en":"creates a vacuum in front of the hood.","zh":"会在通风橱前方形成真空"},{"key":"D","en":"is faster than the speed limit.","zh":"超过规定的速度限制"}],"answer":"B"},{"id":"Fume Hoods-20","section":"Fume Hoods","number":20,"en":"Foot traffic in front of the hood:","zh":"人员在通风橱前方走动：","options":[{"key":"A","en":"creates pressure differentials into which contaminated air may be drawn.","zh":"会产生局部压力差，可能使受污染的空气被带出通风橱"},{"key":"B","en":"verifies air flow into the hood.","zh":"可以验证空气是否流入通风橱"},{"key":"C","en":"creates traffic jams.","zh":"会造成交通拥堵"},{"key":"D","en":"puts the employee in danger of explosions.","zh":"会使工作人员面临爆炸危险"}],"answer":"A"},{"id":"Fume Hoods-21","section":"Fume Hoods","number":21,"en":"When using the fume hood:","zh":"使用化学通风橱时：","options":[{"key":"A","en":"it is necessary to wear eye protection.","zh":"必须佩戴眼部防护用品"},{"key":"B","en":"it is not necessary to wear eye protection.","zh":"不需要佩戴眼部防护用品"},{"key":"C","en":"it is not necessary to use explosion shields.","zh":"不需要使用防爆屏障"},{"key":"D","en":"it is necessary to use the sash as an explosion shield.","zh":"必须将前窗作为防爆屏障使用"}],"answer":"A"},{"id":"Fume Hoods-22","section":"Fume Hoods","number":22,"en":"Air flow indicators should be used to:","zh":"气流指示器应该用于：","options":[{"key":"A","en":"verify air volume into the hood.","zh":"验证进入通风橱的空气流量"},{"key":"B","en":"verify air flow into the hood.","zh":"验证空气是否流入通风橱"},{"key":"C","en":"verify air flow velocity into the hood.","zh":"验证进入通风橱的气流速度"},{"key":"D","en":"verify the absence of spillage from the hood.","zh":"验证通风橱内没有发生泄漏"}],"answer":"B"},{"id":"Fume Hoods-23","section":"Fume Hoods","number":23,"en":"Electrical outlets should always be used where in the hood?","zh":"通风橱使用的电源插座应该设置在哪里？","options":[{"key":"A","en":"as close to the equipment as possible.","zh":"尽可能靠近设备"},{"key":"B","en":"within the hood.","zh":"通风橱内部"},{"key":"C","en":"outside the hood.","zh":"通风橱外部"},{"key":"D","en":"far from the water faucets.","zh":"远离水龙头的位置"}],"answer":"C"},{"id":"Fume Hoods-24","section":"Fume Hoods","number":24,"en":"The hood protects the user from:","zh":"化学通风橱主要保护使用者免受以下哪种危险？","options":[{"key":"A","en":"spills.","zh":"化学品泄漏"},{"key":"B","en":"inhalation of harmful vapors.","zh":"吸入有害蒸气"},{"key":"C","en":"explosions.","zh":"爆炸"},{"key":"D","en":"splashes.","zh":"化学品飞溅"}],"answer":"B"},{"id":"Fume Hoods-25","section":"Fume Hoods","number":25,"en":"Who is responsible for verifying the hood is working before use?","zh":"在使用通风橱之前，谁负责确认通风橱正常运行？","options":[{"key":"A","en":"maintenance people.","zh":"维修人员"},{"key":"B","en":"Environmental activists.","zh":"环保活动人士"},{"key":"C","en":"The user.","zh":"使用者本人"},{"key":"D","en":"Management.","zh":"管理人员"}],"answer":"C"},{"id":"Personal Protective Equipment-1","section":"Personal Protective Equipment","number":1,"en":"Personal Protective Equipment (PPE) protects the employee beyond what other type of control:","zh":"除了以下哪种控制措施之外，个人防护装备（PPE）还能为员工提供额外保护？","options":[{"key":"A","en":"Parental","zh":"家长控制"},{"key":"B","en":"Engineering","zh":"工程控制"},{"key":"C","en":"Legal","zh":"法律控制"},{"key":"D","en":"Supervisory","zh":"监督管理控制"}],"answer":"B"},{"id":"Personal Protective Equipment-2","section":"Personal Protective Equipment","number":2,"en":"Employees can fail to adequately protect themselves by choosing PPE this is neither:","zh":"如果员工选择的 PPE 不具备以下哪两项特性，可能无法充分保护自己？","options":[{"key":"A","en":"Fashionable nor comfortable.","zh":"时尚且舒适"},{"key":"B","en":"Sufficient nor appropriate.","zh":"防护充分且适用"},{"key":"C","en":"Fashionable nor sufficient.","zh":"时尚且防护充分"},{"key":"D","en":"Sufficient nor comfortable.","zh":"防护充分且舒适"}],"answer":"B"},{"id":"Personal Protective Equipment-3","section":"Personal Protective Equipment","number":3,"en":"PPE is effective by providing a ______ between the skin and hazard.","zh":"PPE 通过在皮肤和危险源之间提供______来发挥防护作用。","options":[{"key":"A","en":"Barrier","zh":"屏障"},{"key":"B","en":"Layer of plastic","zh":"塑料层"},{"key":"C","en":"Fortress","zh":"堡垒"},{"key":"D","en":"Magical spell","zh":"魔法咒语"}],"answer":"A"},{"id":"Personal Protective Equipment-4","section":"Personal Protective Equipment","number":4,"en":"Excessive noise in the laboratory may cause:","zh":"实验室中过大的噪声可能导致：","options":[{"key":"A","en":"Tinnitus.","zh":"耳鸣"},{"key":"B","en":"Shouting.","zh":"大声喊叫"},{"key":"C","en":"Heart failure.","zh":"心力衰竭"},{"key":"D","en":"Arguments.","zh":"争吵"}],"answer":"D"},{"id":"Personal Protective Equipment-5","section":"Personal Protective Equipment","number":5,"en":"The first step in identifying proper PPE is:","zh":"确定合适 PPE 的第一步是：","options":[{"key":"A","en":"Checking for sufficient funds.","zh":"检查是否有足够资金"},{"key":"B","en":"Writing a risk management plan.","zh":"制定风险管理计划"},{"key":"C","en":"Identifying the exact hazard.","zh":"识别具体危险源"},{"key":"D","en":"Understanding compatibility of chemicals.","zh":"了解化学品的相容性"}],"answer":"C"},{"id":"Personal Protective Equipment-6","section":"Personal Protective Equipment","number":6,"en":"Other considerations to include in choosing appropriate PPE include:","zh":"选择合适 PPE 时，还应考虑以下哪些因素？","options":[{"key":"A","en":"Concentration and potential for injury.","zh":"浓度和潜在伤害程度"},{"key":"B","en":"Concentration and duration of exposure.","zh":"浓度和暴露持续时间"},{"key":"C","en":"Concentration and color of the hazard.","zh":"浓度和危险物质的颜色"},{"key":"D","en":"Zodiac sign of the employee and temperature of the hazard.","zh":"员工的星座和危险物质的温度"}],"answer":"B"},{"id":"Personal Protective Equipment-7","section":"Personal Protective Equipment","number":7,"en":"The type of glove that is effective against all hazards is:","zh":"哪种类型的手套能够有效防护所有危险？","options":[{"key":"A","en":"Leather.","zh":"皮革手套"},{"key":"B","en":"Latex","zh":"乳胶手套"},{"key":"C","en":"Nitrile","zh":"丁腈手套"},{"key":"D","en":"None of the above.","zh":"以上都不是"}],"answer":"D"},{"id":"Personal Protective Equipment-8","section":"Personal Protective Equipment","number":8,"en":"The final choice of a glove material should be made only after consulting:","zh":"最终确定防护手套的材料时，应首先参考：","options":[{"key":"A","en":"Lab Safety Series, PPE in the Laboratory.","zh":"《实验室安全系列：实验室个人防护装备》"},{"key":"B","en":"The CEO of the company.","zh":"公司首席执行官"},{"key":"C","en":"Manufacturer's chemical resistance guides.","zh":"制造商提供的化学品耐受性指南"},{"key":"D","en":"Material Safety Data Sheets.","zh":"材料安全数据表"}],"answer":"C"},{"id":"Personal Protective Equipment-9","section":"Personal Protective Equipment","number":9,"en":"Factors affecting the performance of the glove in a specific case include:","zh":"在特定使用场景下，影响手套防护性能的因素包括：","options":[{"key":"A","en":"Chemical resistance, size, and material thickness.","zh":"耐化学性、尺寸和材料厚度"},{"key":"B","en":"Material thickness, chemical resistance, and atmospheric pressure.","zh":"材料厚度、耐化学性和大气压力"},{"key":"C","en":"Amount of hand flex, location of the lab, and cost of the glove.","zh":"手部弯曲程度、实验室位置和手套成本"},{"key":"D","en":"Material thickness, size, and location of the lab.","zh":"材料厚度、尺寸和实验室位置"}],"answer":"A"},{"id":"Personal Protective Equipment-10","section":"Personal Protective Equipment","number":10,"en":"Permeation of a glove material refers to:","zh":"手套材料的渗透（Permeation）是指：","options":[{"key":"A","en":"Diffusion of the chemical through the glove.","zh":"化学物质通过手套材料扩散"},{"key":"B","en":"Longevity of the glove.","zh":"手套的使用寿命"},{"key":"C","en":"The geometry of the glove.","zh":"手套的几何形状"},{"key":"D","en":"Resistance to tearing.","zh":"抗撕裂能力"}],"answer":"A"},{"id":"Personal Protective Equipment-11","section":"Personal Protective Equipment","number":11,"en":"A hazard of latex gloves is:","zh":"乳胶手套的一个潜在危险是：","options":[{"key":"A","en":"Poor dexterity.","zh":"手部灵活性差"},{"key":"B","en":"Bacterial infection.","zh":"细菌感染"},{"key":"C","en":"Allergic reactions.","zh":"过敏反应"},{"key":"D","en":"Expense.","zh":"价格昂贵"}],"answer":"C"},{"id":"Personal Protective Equipment-12","section":"Personal Protective Equipment","number":12,"en":"A glove material that resists chlorinated solvents is:","zh":"哪种手套材料能够抵抗氯代溶剂？","options":[{"key":"A","en":"Polyvinyl chloride.","zh":"聚氯乙烯（PVC）"},{"key":"B","en":"Viton.","zh":"氟橡胶（Viton）"},{"key":"C","en":"Latex.","zh":"乳胶"},{"key":"D","en":"Leather","zh":"皮革"}],"answer":"B"},{"id":"Personal Protective Equipment-13","section":"Personal Protective Equipment","number":13,"en":"A benefit of using disposable gloves is:","zh":"使用一次性手套的一个优点是：","options":[{"key":"A","en":"Dexterity.","zh":"手部操作灵活性"},{"key":"B","en":"They are fashionable.","zh":"外观时尚"},{"key":"C","en":"They are resistant to tearing.","zh":"抗撕裂能力强"},{"key":"D","en":"The length of time of protection is increased.","zh":"延长防护时间"}],"answer":"A"},{"id":"Personal Protective Equipment-14","section":"Personal Protective Equipment","number":14,"en":"What consideration should be made when removing gloves?","zh":"脱下手套时应特别注意什么？","options":[{"key":"A","en":"Cost","zh":"成本"},{"key":"B","en":"Size","zh":"尺寸"},{"key":"C","en":"Comfort","zh":"舒适度"},{"key":"D","en":"Contamination","zh":"污染"}],"answer":"D"},{"id":"Personal Protective Equipment-15","section":"Personal Protective Equipment","number":15,"en":"An organ especially vulnerable to injury from a variety of laboratory hazards is:","zh":"在实验室中，特别容易受到多种危险因素伤害的器官是：","options":[{"key":"A","en":"The brain","zh":"大脑"},{"key":"B","en":"The eye.","zh":"眼睛"},{"key":"C","en":"The pancreas.","zh":"胰腺"},{"key":"D","en":"The Wurlitzer","zh":"Wurlitzer（原题中的干扰选项，通常为品牌名称）"}],"answer":"B"},{"id":"Personal Protective Equipment-16","section":"Personal Protective Equipment","number":16,"en":"Which standards describe the design, construction, testing and use of eye protection?","zh":"哪个标准体系规定了眼部防护用品的设计、制造、测试和使用要求？","options":[{"key":"A","en":"ANSI","zh":"美国国家标准协会"},{"key":"B","en":"EPA","zh":"美国环境保护署"},{"key":"C","en":"NFPA","zh":"美国国家消防协会"},{"key":"D","en":"ASTM","zh":"美国材料与试验协会"}],"answer":"A"},{"id":"Personal Protective Equipment-17","section":"Personal Protective Equipment","number":17,"en":"For splashing hazards, which eye protection would be adequate?","zh":"对于液体飞溅危险，哪种眼部防护措施是适当的？","options":[{"key":"A","en":"Chemically resistant materials.","zh":"耐化学腐蚀材料"},{"key":"B","en":"Goggles and a face shield.","zh":"化学防护护目镜和面罩"},{"key":"C","en":"Side shields.","zh":"侧面防护片"},{"key":"D","en":"Tinted lenses.","zh":"有色镜片"}],"answer":"C"},{"id":"Personal Protective Equipment-18","section":"Personal Protective Equipment","number":18,"en":"Damage to eyes from exposure to harmful radiation:","zh":"眼睛暴露于有害辐射后造成的损伤：","options":[{"key":"A","en":"Is prevented by use of polycarbonate lenses.","zh":"使用聚碳酸酯镜片即可预防"},{"key":"B","en":"May not be felt for hours after the exposure.","zh":"可能在暴露数小时后才出现症状"},{"key":"C","en":"Is covered by Worker's Compensation.","zh":"属于工伤赔偿范围"},{"key":"D","en":"Is difficult to incur.","zh":"很难发生"}],"answer":"B"},{"id":"Personal Protective Equipment-19","section":"Personal Protective Equipment","number":19,"en":"Two factors influencing whether personnel will wear eye protection include:","zh":"影响工作人员是否愿意佩戴眼部防护用品的两个因素包括：","options":[{"key":"A","en":"Zodiac sign and fashion","zh":"星座和时尚程度"},{"key":"B","en":"Cost and fashion","zh":"成本和时尚程度"},{"key":"C","en":"Comfort and fashion","zh":"舒适度和外观"},{"key":"D","en":"Comfort and cost","zh":"舒适度和成本"}],"answer":"C"},{"id":"Personal Protective Equipment-20","section":"Personal Protective Equipment","number":20,"en":"Open-toed shoes are appropriate in the:","zh":"露趾鞋适合在哪个场所穿着？","options":[{"key":"A","en":"Lounge.","zh":"休息室"},{"key":"B","en":"Lab.","zh":"实验室"},{"key":"C","en":"Operating Room","zh":"手术室"},{"key":"D","en":"Kitchen","zh":"厨房"}],"answer":"A"},{"id":"Personal Protective Equipment-21","section":"Personal Protective Equipment","number":21,"en":"A hazard of synthetic fabric in lab coats is:","zh":"使用合成纤维制作实验服可能带来的危险是：","options":[{"key":"A","en":"Flammability","zh":"易燃性"},{"key":"B","en":"Melting in a fire.","zh":"遇火熔化"},{"key":"C","en":"Dissolving in solvents.","zh":"在某些溶剂中溶解"},{"key":"D","en":"All of the Above","zh":"以上全部"}],"answer":"D"},{"id":"Personal Protective Equipment-22","section":"Personal Protective Equipment","number":22,"en":"Contaminated PPE:","zh":"对于受到污染的个人防护装备：","options":[{"key":"A","en":"Should be washed in a dedicated washing machine.","zh":"应使用专用洗衣机清洗"},{"key":"B","en":"Should always be disposed as hazardous waste.","zh":"应始终作为危险废物处理"},{"key":"C","en":"Should be removed so that contamination is not held next to the skin.","zh":"应及时脱下，避免污染物持续接触皮肤"},{"key":"D","en":"Both a and c.","zh":"A 和 C 均正确"}],"answer":"D"},{"id":"Personal Protective Equipment-23","section":"Personal Protective Equipment","number":23,"en":"The measurement unit of noise is the:","zh":"噪声的测量单位是：","options":[{"key":"A","en":"Decibel","zh":"分贝（dB）"},{"key":"B","en":"Jewell","zh":"焦耳（原题拼写为 Jewell）"},{"key":"C","en":"Roentgen","zh":"伦琴"},{"key":"D","en":"Decameter","zh":"十米"}],"answer":"A"},{"id":"Personal Protective Equipment-24","section":"Personal Protective Equipment","number":24,"en":"Hearing protection should be used if:","zh":"在以下哪种情况下应使用听力防护用品？","options":[{"key":"A","en":"High frequency noise is generated.","zh":"产生高频噪声"},{"key":"B","en":"Shielding noisy equipment is not feasible.","zh":"无法对噪声设备进行隔离或屏蔽"},{"key":"C","en":"Concentration is critical.","zh":"需要高度集中注意力"},{"key":"D","en":"The neighbor plays classical music.","zh":"邻居播放古典音乐"}],"answer":"B"},{"id":"Personal Protective Equipment-25","section":"Personal Protective Equipment","number":25,"en":"PPE protects employees if:","zh":"PPE 在什么条件下能够有效保护工作人员？","options":[{"key":"A","en":"The employer purchases it.","zh":"雇主购买了 PPE"},{"key":"B","en":"It is fashionable.","zh":"PPE 外观时尚"},{"key":"C","en":"It is heavy duty.","zh":"PPE 属于重型防护装备"},{"key":"D","en":"The appropriate PPE is chosen and used appropriately.","zh":"选择合适的 PPE 并正确使用"}],"answer":"D"},{"id":"Reactive-1","section":"Reactive","number":1,"en":"Reactive categories include:","zh":"反应性化学品的类别包括：","options":[{"key":"A","en":"shock sensitivity, corrosivity, and pyrophorics.","zh":"冲击敏感性、腐蚀性和自燃性物质"},{"key":"B","en":"pyrophorics, shock sensitivity, and self-polymerization.","zh":"自燃性物质、冲击敏感性和自聚合反应"},{"key":"C","en":"shock sensitivity, pyrophorics, and toxicity.","zh":"冲击敏感性、自燃性物质和毒性"},{"key":"D","en":"pyrophorics, corrosivity and flammability.","zh":"自燃性物质、腐蚀性和易燃性"}],"answer":"B"},{"id":"Reactive-2","section":"Reactive","number":2,"en":"Reactive categories refer to:","zh":"反应性化学品的分类主要涉及：","options":[{"key":"A","en":"similar acute or chronic health effects.","zh":"相似的急性或慢性健康影响"},{"key":"B","en":"chemical compatabilities.","zh":"化学相容性"},{"key":"C","en":"explosive situations only.","zh":"仅涉及爆炸情况"},{"key":"D","en":"safety considerations for use and storage.","zh":"使用和储存过程中的安全注意事项"}],"answer":"D"},{"id":"Reactive-3","section":"Reactive","number":3,"en":"A hazard associated with a self-polymerizing chemical reaction might be:","zh":"自聚合化学反应可能产生的危险是：","options":[{"key":"A","en":"a solid instead of a liquid product.","zh":"生成固体而不是液体产物"},{"key":"B","en":"an over-pressurized container.","zh":"容器内部压力过高"},{"key":"C","en":"a runaway reaction that might grow out of the container.","zh":"可能失控并蔓延至容器外的反应"},{"key":"D","en":"a corrosive resultant product.","zh":"产生具有腐蚀性的反应产物"}],"answer":"B"},{"id":"Reactive-4","section":"Reactive","number":4,"en":"Self-polymerization may be minimized through the use of:","zh":"可以通过使用以下哪种物质来降低自聚合风险？","options":[{"key":"A","en":"isolated storage.","zh":"隔离储存"},{"key":"B","en":"a proper container.","zh":"合适的容器"},{"key":"C","en":"an inhibitor.","zh":"阻聚剂"},{"key":"D","en":"a fire extinguisher.","zh":"灭火器"}],"answer":"C"},{"id":"Reactive-5","section":"Reactive","number":5,"en":"Which of the following may happen with water reactive chemicals mixing with water?","zh":"遇水反应性化学品与水混合时，可能发生以下哪种情况？","options":[{"key":"A","en":"formation of corrosive acids","zh":"形成腐蚀性酸"},{"key":"B","en":"release of flammable, toxic, or oxidizing vapors","zh":"释放易燃、有毒或具有氧化性的蒸气"},{"key":"C","en":"all the above","zh":"以上全部"}],"answer":"C"},{"id":"Reactive-6","section":"Reactive","number":6,"en":"Storage of water reactive chemicals should include:","zh":"遇水反应性化学品的储存要求包括：","options":[{"key":"A","en":"water-right cabinets and spill kits.","zh":"防水柜和泄漏处理工具包（原文为 water-right）"},{"key":"B","en":"in a water tight cabinet and signing for all materials dispersed.","zh":"存放在防水柜中，并对所有分发的材料进行签收"},{"key":"C","en":"storage away from water sources, in a water tight cabinet and proper labeling.","zh":"远离水源、存放在防水柜中并正确标识"},{"key":"D","en":"security and proper labeling.","zh":"安全防护和正确标识"}],"answer":"C"},{"id":"Reactive-7","section":"Reactive","number":7,"en":"Fire extinguishers for water-reactive chemicals should be which class?","zh":"对于遇水反应性化学品，应使用哪一类灭火器？","options":[{"key":"A","en":"D","zh":"D 类"},{"key":"B","en":"A, B, C","zh":"A、B、C 类"},{"key":"C","en":"B","zh":"B 类"},{"key":"D","en":"A","zh":"A 类"}],"answer":"A"},{"id":"Reactive-8","section":"Reactive","number":8,"en":"Pyrophorics spontaneously ignite in the presence of what?","zh":"自燃性物质在接触什么时会自发燃烧？","options":[{"key":"A","en":"water","zh":"水"},{"key":"B","en":"oxidizer.","zh":"氧化剂"},{"key":"C","en":"air","zh":"空气"},{"key":"D","en":"nitrogen","zh":"氮气"}],"answer":"C"},{"id":"Reactive-9","section":"Reactive","number":9,"en":"Pyrophorics should be stored:","zh":"自燃性物质应该如何储存？","options":[{"key":"A","en":"under water.","zh":"浸没在水中"},{"key":"B","en":"under inert atmospheres or substances.","zh":"储存在惰性气氛或惰性保护介质中"},{"key":"C","en":"under organic compounds.","zh":"储存在有机化合物中"},{"key":"D","en":"in completely filled containers.","zh":"储存在完全装满的容器中"}],"answer":"B"},{"id":"Reactive-10","section":"Reactive","number":10,"en":"Natural uptake of atmospheric oxygen forms which unstable compounds?","zh":"物质自然吸收空气中的氧气后，可能形成哪种不稳定化合物？","options":[{"key":"A","en":"persulfates","zh":"过硫酸盐"},{"key":"B","en":"peroxides","zh":"过氧化物"},{"key":"C","en":"perchlorates","zh":"高氯酸盐"}],"answer":"B"},{"id":"Reactive-11","section":"Reactive","number":11,"en":"Containers of peroxide formers should be labeled with which dates?","zh":"易形成过氧化物的化学品容器应该标注哪些日期？","options":[{"key":"A","en":"date opened and date emptied","zh":"开封日期和用空日期"},{"key":"B","en":"date tested for peroxides and date emptied","zh":"过氧化物检测日期和用空日期"},{"key":"C","en":"date purchased and date opened","zh":"购买日期和开封日期"}],"answer":"A"},{"id":"Reactive-12","section":"Reactive","number":12,"en":"The tendency to form peroxides is enhanced through:","zh":"以下哪种情况会增加形成过氧化物的倾向？","options":[{"key":"A","en":"concentration by distillation or evaporation.","zh":"通过蒸馏或蒸发进行浓缩"},{"key":"B","en":"storage under an inert atmosphere.","zh":"在惰性气氛中储存"},{"key":"C","en":"heating.","zh":"加热"},{"key":"D","en":"regular inspections.","zh":"定期检查"}],"answer":"A"},{"id":"Reactive-13","section":"Reactive","number":13,"en":"Flammables are incompatible with:","zh":"易燃物与以下哪类物质不相容？","options":[{"key":"A","en":"oxidizers.","zh":"氧化剂"},{"key":"B","en":"water-reactive chemicals.","zh":"遇水反应性化学品"},{"key":"C","en":"salts.","zh":"盐类"},{"key":"D","en":"combustibles.","zh":"可燃物"}],"answer":"A"},{"id":"Reactive-14","section":"Reactive","number":14,"en":"Oxidizers make extinguishing a fire difficult because they:","zh":"氧化剂会使火灾更难扑灭，因为它们：","options":[{"key":"A","en":"add more oxygen to the fire.","zh":"为火灾提供更多氧气"},{"key":"B","en":"add more fuel to the fire.","zh":"为火灾提供更多燃料"},{"key":"C","en":"they are an inert substance.","zh":"它们属于惰性物质"},{"key":"D","en":"increase the heat due to the reaction.","zh":"由于反应而增加热量"}],"answer":"A"},{"id":"Reactive-15","section":"Reactive","number":15,"en":"Incompatible chemicals stop being incompatible when:","zh":"不相容的化学品在什么情况下不再具有不相容性？","options":[{"key":"A","en":"they are placed in waste containers.","zh":"它们被放入废物容器中"},{"key":"B","en":"they have reacted to become compatible chemicals.","zh":"它们经过反应转化为相容的化学物质"},{"key":"C","en":"they are stored in separate containers within the same cabinet.","zh":"它们被储存在同一柜子内的不同容器中"},{"key":"D","en":"they are declared compatible.","zh":"它们被宣布为相容"}],"answer":"B"},{"id":"Reactive-16","section":"Reactive","number":16,"en":"Some chemicals become shock sensitive through:","zh":"某些化学品可能通过以下哪些过程变得对冲击敏感？","options":[{"key":"A","en":"aging.","zh":"老化"},{"key":"B","en":"decomposition.","zh":"分解"},{"key":"C","en":"drying.","zh":"干燥"},{"key":"D","en":"all the above.","zh":"以上全部"}],"answer":"D"},{"id":"Reactive-17","section":"Reactive","number":17,"en":"If a material becomes shock sensitive:","zh":"如果某种物质变得对冲击敏感：","options":[{"key":"A","en":"call the professionals to dispose of it.","zh":"联系专业人员进行处置"},{"key":"B","en":"move the container to a remote location.","zh":"将容器移动到偏远位置"},{"key":"C","en":"evacuate the building.","zh":"疏散整栋建筑"},{"key":"D","en":"run away.","zh":"立即跑开"}],"answer":"A"},{"id":"Reactive-18","section":"Reactive","number":18,"en":"The characteristic that distinguishes high explosives is:","zh":"高爆炸药（High explosives）的主要区别特征是：","options":[{"key":"A","en":"the toxicity.","zh":"毒性"},{"key":"B","en":"the sudden shock wave that travels faster than the speed of sound.","zh":"产生传播速度超过声速的冲击波"},{"key":"C","en":"the sudden release of energy is a ball of flame.","zh":"能量突然释放形成火球"},{"key":"D","en":"the Dept. of Transportation special regulations.","zh":"交通运输部门的特殊规定"}],"answer":"B"},{"id":"Reactive-19","section":"Reactive","number":19,"en":"Sources of information for reactivity include:","zh":"关于化学品反应性的信息来源包括：","options":[{"key":"A","en":"textbooks, fellow chemists, and journals.","zh":"教科书、其他化学研究人员和学术期刊"},{"key":"B","en":"chemistry textbooks, labels, and the manufacturer.","zh":"化学教科书、标签和制造商"},{"key":"C","en":"labels, material safety data sheets, and textbooks.","zh":"标签、材料安全数据表和教科书"},{"key":"D","en":"Books, journals, and material safety data sheets.","zh":"书籍、期刊和材料安全数据表"}],"answer":"D"},{"id":"Reactive-20","section":"Reactive","number":20,"en":"Proper storage includes:","zh":"正确的储存条件包括：","options":[{"key":"A","en":"coolness, low electromagnetic frequencies, and isolation.","zh":"低温、低电磁频率和隔离"},{"key":"B","en":"inert atmospheres, no water lines, and burial underground.","zh":"惰性气氛、远离水管和地下掩埋"},{"key":"C","en":"isolation, coolness, and no sunlight.","zh":"隔离、保持凉爽和避免阳光照射"},{"key":"D","en":"isolation from people, and burial underground.","zh":"远离人员并埋入地下"}],"answer":"C"},{"id":"Reactive-21","section":"Reactive","number":21,"en":"Purchasing habits that might minimize reactive hazards include:","zh":"有助于降低反应性化学品危险的采购方式包括：","options":[{"key":"A","en":"shopping for the lowest price only.","zh":"只购买价格最低的产品"},{"key":"B","en":"reduction in inventory.","zh":"减少库存"},{"key":"C","en":"just-in-time purchasing, reduction in inventory.","zh":"按需及时采购并减少库存"},{"key":"D","en":"just-in-time purchasing.","zh":"按需及时采购"}],"answer":"C"},{"id":"Reactive-22","section":"Reactive","number":22,"en":"An effective barrier between the employee and the reactive might be:","zh":"在工作人员与反应性化学品之间，有效的防护屏障可以是：","options":[{"key":"A","en":"an explosion shield that is weighted at the bottom.","zh":"底部加重的防爆屏障"},{"key":"B","en":"lead shielding.","zh":"铅屏蔽"},{"key":"C","en":"the sash of the fume hood.","zh":"通风橱的前窗"},{"key":"D","en":"a wall of firebrick.","zh":"耐火砖墙"}],"answer":"A"},{"id":"Reactive-23","section":"Reactive","number":23,"en":"Other hazards present with reactivity might include:","zh":"反应性化学品还可能具有以下哪些危险？","options":[{"key":"A","en":"toxicity.","zh":"毒性"},{"key":"B","en":"corrosivity.","zh":"腐蚀性"},{"key":"C","en":"flammability.","zh":"易燃性"},{"key":"D","en":"all the above.","zh":"以上全部"}],"answer":"D"},{"id":"Reactive-24","section":"Reactive","number":24,"en":"First aid for an accident involving reactives:","zh":"涉及反应性化学品的事故，其急救措施：","options":[{"key":"A","en":"is always water.","zh":"始终使用水"},{"key":"B","en":"depends on the injury received.","zh":"取决于所受到的伤害"},{"key":"C","en":"depends on the individual involved.","zh":"取决于涉及的个人"}],"answer":"C"},{"id":"Reactive-25","section":"Reactive","number":25,"en":"Peroxidizable compounds should be tested how often?","zh":"易形成过氧化物的化合物应该多久检测一次？","options":[{"key":"A","en":"3, 6, or 12 months depending on the class of chemical.","zh":"根据化学品类别，每 3、6 或 12 个月检测一次"},{"key":"B","en":"every 6 months.","zh":"每 6 个月一次"},{"key":"C","en":"every 6 months.","zh":"每 6 个月一次"},{"key":"D","en":"every 12 months.","zh":"每 12 个月一次"}],"answer":"A"},{"id":"Safety Equipment-1","section":"Safety Equipment","number":1,"en":"Two primary goals of safety in the laboratory are:","zh":"实验室安全的两个主要目标是：","options":[{"key":"A","en":"Prevention and precision.","zh":"预防与精确性"},{"key":"B","en":"Prevention and precipitation.","zh":"预防与沉淀"},{"key":"C","en":"Precaution and prevention.","zh":"预防措施与事故预防"},{"key":"D","en":"Prevention and preparation.","zh":"预防与准备"}],"answer":"D"},{"id":"Safety Equipment-2","section":"Safety Equipment","number":2,"en":"______ is necessary for effective and efficient use of laboratory safety equipment.","zh":"有效且高效地使用实验室安全设备需要______。","options":[{"key":"A","en":"Commitment","zh":"责任心"},{"key":"B","en":"Training","zh":"培训"},{"key":"C","en":"Purchase","zh":"购买"},{"key":"D","en":"Luck","zh":"运气"}],"answer":"B"},{"id":"Safety Equipment-3","section":"Safety Equipment","number":3,"en":"Large fires are typically extinguished by:","zh":"大型火灾通常通过以下哪种方式扑灭？","options":[{"key":"A","en":"Large fire extinguishers.","zh":"大型灭火器"},{"key":"B","en":"Automatic fire suppression systems.","zh":"自动灭火系统"},{"key":"C","en":"Heroes.","zh":"英雄人物"}],"answer":"B"},{"id":"Safety Equipment-4","section":"Safety Equipment","number":4,"en":"Virtually all fires start:","zh":"几乎所有火灾在开始时都是：","options":[{"key":"A","en":"Through carelessness.","zh":"由于疏忽大意"},{"key":"B","en":"When no one is around.","zh":"在无人看管时"},{"key":"C","en":"Deliberately.","zh":"故意引发"},{"key":"D","en":"Small.","zh":"小规模的"}],"answer":"D"},{"id":"Safety Equipment-5","section":"Safety Equipment","number":5,"en":"Class B fires involve which material as fuel for the oxidation-reduction reaction?","zh":"B 类火灾涉及哪种物质作为氧化还原反应中的燃料？","options":[{"key":"A","en":"Combustible metals.","zh":"可燃金属"},{"key":"B","en":"Energized electric equipment.","zh":"带电电气设备"},{"key":"C","en":"Flammable liquids.","zh":"易燃液体"},{"key":"D","en":"Salts.","zh":"盐类"}],"answer":"C"},{"id":"Safety Equipment-6","section":"Safety Equipment","number":6,"en":"One of the hazards of dry chemical extinguishing agents is that it is:","zh":"干粉灭火剂的潜在危险之一是：","options":[{"key":"A","en":"Flammable.","zh":"易燃的"},{"key":"B","en":"Toxic.","zh":"有毒的"},{"key":"C","en":"Corrosive.","zh":"具有腐蚀性的"},{"key":"D","en":"Reactive.","zh":"具有反应性的"}],"answer":"C"},{"id":"Safety Equipment-7","section":"Safety Equipment","number":7,"en":"Halon is useful on which classes of fire?","zh":"哈龙灭火剂适用于以下哪几类火灾？","options":[{"key":"A","en":"A and D","zh":"A 类和 D 类"},{"key":"B","en":"B and D","zh":"B 类和 D 类"},{"key":"C","en":"C and D","zh":"C 类和 D 类"},{"key":"D","en":"None of the above.","zh":"以上都不是"}],"answer":"D"},{"id":"Safety Equipment-8","section":"Safety Equipment","number":8,"en":"Where are most fire extinguishers found in laboratories?","zh":"实验室中的灭火器通常设置在哪里？","options":[{"key":"A","en":"Below the telephone.","zh":"电话机下方"},{"key":"B","en":"Close to the computers.","zh":"计算机附近"},{"key":"C","en":"Next to the other safety equipment.","zh":"其他安全设备旁边"},{"key":"D","en":"By the exit of the lab and by particularly flammable operations.","zh":"实验室出口附近及易燃操作区域附近"}],"answer":"D"},{"id":"Safety Equipment-9","section":"Safety Equipment","number":9,"en":"When in doubt about whether to fight a fire or call for help:","zh":"当不确定应该自行灭火还是寻求帮助时：","options":[{"key":"A","en":"Call for help.","zh":"寻求帮助"},{"key":"B","en":"Stick your head in the sand.","zh":"逃避问题"},{"key":"C","en":"Yell for your supervisor.","zh":"大声呼叫主管"},{"key":"D","en":"Document your decision for later investigation.","zh":"记录决定以供后续调查"}],"answer":"A"},{"id":"Safety Equipment-10","section":"Safety Equipment","number":10,"en":"Small fires that may be extinguished in 30 seconds are defined as the size of:","zh":"可以在 30 秒内扑灭的小型火灾，其规模通常相当于：","options":[{"key":"A","en":"A two and a half liter jug.","zh":"一个 2.5 升的容器"},{"key":"B","en":"A trash can.","zh":"一个垃圾桶"},{"key":"C","en":"A desk.","zh":"一张桌子"},{"key":"D","en":"The fire extinguisher.","zh":"一个灭火器"}],"answer":"B"},{"id":"Safety Equipment-11","section":"Safety Equipment","number":11,"en":"The most common error made in fighting fires with a fire extinguisher is:","zh":"使用灭火器扑灭火灾时，最常见的错误是：","options":[{"key":"A","en":"Leaving too soon.","zh":"过早离开"},{"key":"B","en":"Throwing the fire extinguisher into the fire.","zh":"将灭火器扔进火中"},{"key":"C","en":"Breathing the extinguishing agent.","zh":"吸入灭火剂"},{"key":"D","en":"Aiming the spray into the flames.","zh":"将灭火剂直接喷向火焰"}],"answer":"D"},{"id":"Safety Equipment-12","section":"Safety Equipment","number":12,"en":"The acronym PASS used in fighting fires stands for:","zh":"灭火操作中的 PASS 缩写代表：","options":[{"key":"A","en":"Pull, Analyze, Squeeze, Skip","zh":"拔出、分析、按压、跳过"},{"key":"B","en":"Pick-up, Aim, Squirt, Sweep","zh":"拿起、瞄准、喷射、扫射"},{"key":"C","en":"Pull, Aim, Squeeze, Sweep","zh":"拔出保险销、瞄准火源根部、压下手柄、左右扫射"},{"key":"D","en":"Pick-up, Aim, Squeeze, Squirt","zh":"拿起、瞄准、按压、喷射"}],"answer":"C"},{"id":"Safety Equipment-13","section":"Safety Equipment","number":13,"en":"How often should fire extinguishers be inspected and serviced?","zh":"灭火器应该多久进行一次检查和维护？","options":[{"key":"A","en":"Whenever they are discharged only.","zh":"仅在使用后"},{"key":"B","en":"Monthly or whenever they are discharged.","zh":"每月或每次使用后"},{"key":"C","en":"Biannually.","zh":"每年两次"},{"key":"D","en":"Annually or whenever they are discharged.","zh":"每年或每次使用后"}],"answer":"D"},{"id":"Safety Equipment-14","section":"Safety Equipment","number":14,"en":"The most important first aid for chemicals in the eye is:","zh":"化学物质进入眼睛后，最重要的急救措施是：","options":[{"key":"A","en":"Calming the victim.","zh":"安抚伤者"},{"key":"B","en":"Calling 911 for emergency responders.","zh":"拨打 911 请求紧急救援"},{"key":"C","en":"Raising feet above the head.","zh":"将双脚抬高至头部以上"},{"key":"D","en":"Copious irrigation with water.","zh":"使用大量清水持续冲洗"}],"answer":"D"},{"id":"Safety Equipment-15","section":"Safety Equipment","number":15,"en":"The time period recommended for washing an injured eye is:","zh":"眼睛受到化学物质伤害后，建议冲洗的时间为：","options":[{"key":"A","en":"15 minutes.","zh":"15 分钟"},{"key":"B","en":"The amount of time needed until pain is gone.","zh":"直到疼痛消失"},{"key":"C","en":"5 minutes","zh":"5 分钟"},{"key":"D","en":"Different for each chemical.","zh":"根据不同化学物质而定"}],"answer":"A"},{"id":"Safety Equipment-16","section":"Safety Equipment","number":16,"en":"The preferred type of eye wash in a laboratory is:","zh":"实验室中首选的洗眼设备是：","options":[{"key":"A","en":"A plumbed eye wash.","zh":"固定管道供水式洗眼器"},{"key":"B","en":"A bottled eye wash.","zh":"瓶装洗眼液"},{"key":"C","en":"The emergency shower.","zh":"紧急淋浴装置"},{"key":"D","en":"The sink.","zh":"水槽"}],"answer":"A"},{"id":"Safety Equipment-17","section":"Safety Equipment","number":17,"en":"Permanent injury can occur to the eye from chemicals in what time frame?","zh":"化学物质接触眼睛后，可能在多短时间内造成永久性损伤？","options":[{"key":"A","en":"1 second","zh":"1 秒"},{"key":"B","en":"10 seconds","zh":"10 秒"},{"key":"C","en":"1 minute","zh":"1 分钟"},{"key":"D","en":"10 microseconds","zh":"10 微秒"}],"answer":"B"},{"id":"Safety Equipment-18","section":"Safety Equipment","number":18,"en":"Eye washes should be located so that an employee needs travel no farther than:","zh":"洗眼器的设置位置应确保工作人员在多长时间内能够到达？","options":[{"key":"A","en":"50 seconds","zh":"50 秒"},{"key":"B","en":"50 feet","zh":"50 英尺"},{"key":"C","en":"10 seconds","zh":"10 秒"},{"key":"D","en":"10 feet","zh":"10 英尺"}],"answer":"C"},{"id":"Safety Equipment-19","section":"Safety Equipment","number":19,"en":"What is a benefit to testing eye washes weekly?","zh":"每周测试洗眼器有什么好处？","options":[{"key":"A","en":"Corrosion is rinsed from the lines.","zh":"冲洗管道中的腐蚀产物"},{"key":"B","en":"Laboratory plants may be watered regularly.","zh":"可以定期给实验室植物浇水"},{"key":"C","en":"Employees get used to inspections.","zh":"让员工习惯检查"},{"key":"D","en":"Dishes are washed.","zh":"清洗餐具"}],"answer":"A"},{"id":"Safety Equipment-20","section":"Safety Equipment","number":20,"en":"Temperatures too hot or too cold may:","zh":"冲洗水温过高或过低可能导致：","options":[{"key":"A","en":"Encourage a victim to withdraw from the water too soon.","zh":"导致伤者过早停止冲洗"},{"key":"B","en":"Burn an eye.","zh":"对眼睛造成灼伤"},{"key":"C","en":"Enhance the adverse chemical reaction.","zh":"加剧不良化学反应"},{"key":"D","en":"All the above.","zh":"以上全部"}],"answer":"D"},{"id":"Safety Equipment-21","section":"Safety Equipment","number":21,"en":"The reason for keeping the path clear to the eye wash is:","zh":"保持通往洗眼器的通道畅通，主要原因是：","options":[{"key":"A","en":"An aid in custodial work.","zh":"方便清洁维护工作"},{"key":"B","en":"To prevent furniture from getting wet.","zh":"防止家具被弄湿"},{"key":"C","en":"Speed is of the essence in washing the chemical from the eye.","zh":"迅速冲洗眼睛中的化学物质至关重要"}],"answer":"C"},{"id":"Safety Equipment-22","section":"Safety Equipment","number":22,"en":"The length of time recommended for rinsing in an emergency shower is:","zh":"使用紧急淋浴装置时，建议的冲洗时间为：","options":[{"key":"A","en":"10 seconds.","zh":"10 秒"},{"key":"B","en":"15 minutes.","zh":"15 分钟"},{"key":"C","en":"The length of time it takes for the soapy feeling to disappear.","zh":"直到皮肤上的肥皂样感觉消失"},{"key":"D","en":"5 minutes.","zh":"5 分钟"}],"answer":"B"},{"id":"Safety Equipment-23","section":"Safety Equipment","number":23,"en":"How often should showers be tested and inspected?","zh":"紧急淋浴装置应该多久测试和检查一次？","options":[{"key":"A","en":"Weekly.","zh":"每周"},{"key":"B","en":"Monthly.","zh":"每月"},{"key":"C","en":"Annually.","zh":"每年"},{"key":"D","en":"Biannually.","zh":"每年两次"}],"answer":"C"},{"id":"Safety Equipment-24","section":"Safety Equipment","number":24,"en":"Disposal of contaminated rinse water:","zh":"受污染冲洗水的处置方式：","options":[{"key":"A","en":"Is dependent on local regulations of the waste water treatment plant.","zh":"取决于当地污水处理法规"},{"key":"B","en":"Must be retained for analysis to help determine medical treatment.","zh":"必须保留用于分析，以帮助确定医疗方案"},{"key":"C","en":"Can be cleaned according to spill control policy.","zh":"可以按照泄漏控制程序进行清理"},{"key":"D","en":"Must be treated as hazardous waste.","zh":"必须作为危险废物处理"}],"answer":"A"},{"id":"Safety Equipment-25","section":"Safety Equipment","number":25,"en":"______ Can save lives, health and property in an accident situation (if used correctly).","zh":"在事故发生时，如果使用得当，______ 可以挽救生命、保护健康和财产。","options":[{"key":"A","en":"High intelligence.","zh":"高智商"},{"key":"B","en":"Safety equipment.","zh":"安全设备"},{"key":"C","en":"Correct policies.","zh":"正确的政策"},{"key":"D","en":"Good coordination.","zh":"良好的协调"}],"answer":"B"},{"id":"Spill Control-1","section":"Spill Control","number":1,"en":"The key to safety with regards to spills is:","zh":"对于化学品泄漏，确保安全的关键是什么？","options":[{"key":"A","en":"Proper spill kits.","zh":"合适的泄漏处理工具包"},{"key":"B","en":"Practice with cleaning spills.","zh":"练习清理泄漏物"},{"key":"C","en":"State-of-the-art spill kits.","zh":"最先进的泄漏处理工具包"},{"key":"D","en":"Preparation for the spill.","zh":"为泄漏事故做好准备"}],"answer":"D"},{"id":"Spill Control-2","section":"Spill Control","number":2,"en":"The most important point of preparation for spills is:","zh":"泄漏事故准备工作中最重要的一点是什么？","options":[{"key":"A","en":"Prevention of the spill.","zh":"预防泄漏事故"},{"key":"B","en":"Knowing where to call for professional help.","zh":"知道如何联系专业人员寻求帮助"},{"key":"C","en":"Knowledge of the location of the spill kits.","zh":"了解泄漏处理工具包的位置"},{"key":"D","en":"Training in cleaning spills.","zh":"接受泄漏清理培训"}],"answer":"B"},{"id":"Spill Control-3","section":"Spill Control","number":3,"en":"Prevention begins with what?","zh":"预防泄漏事故首先需要什么？","options":[{"key":"A","en":"Proper equipment for the experiment.","zh":"为实验配备合适的设备"},{"key":"B","en":"Knowledge of the hazards of the chemical and experiment.","zh":"了解化学品和实验的危险性"},{"key":"C","en":"Sufficient emergency response training.","zh":"充分的应急响应培训"},{"key":"D","en":"Daily meditation.","zh":"每日冥想"}],"answer":"B"},{"id":"Spill Control-4","section":"Spill Control","number":4,"en":"Hazardous materials should always be handled in what?","zh":"危险材料应始终使用什么容器处理？","options":[{"key":"A","en":"Compatible containers.","zh":"具有化学兼容性的容器"},{"key":"B","en":"Rubber buckets.","zh":"橡胶桶"},{"key":"C","en":"Equipment with paper labels.","zh":"带纸质标签的设备"},{"key":"D","en":"Used glassware.","zh":"使用过的玻璃器皿"}],"answer":"A"},{"id":"Spill Control-5","section":"Spill Control","number":5,"en":"Emergency equipment is used:","zh":"应急设备的用途是什么？","options":[{"key":"A","en":"To contain liability for the employer.","zh":"限制雇主的法律责任"},{"key":"B","en":"To protect human life and health in the event of a spill.","zh":"在发生泄漏时保护人员生命和健康"},{"key":"C","en":"Only after proper training.","zh":"仅在接受适当培训后使用"},{"key":"D","en":"Last after taking care of the spill containment.","zh":"在完成泄漏围堵后最后使用"}],"answer":"B"},{"id":"Spill Control-6","section":"Spill Control","number":6,"en":"Personal protective equipment to be used with spill kits include:","zh":"使用泄漏处理工具包时，应配备哪些个人防护装备？","options":[{"key":"A","en":"Fire bunker and gloves.","zh":"消防防护装备和手套"},{"key":"B","en":"Hard hats, steel toed boots, and gloves.","zh":"安全帽、钢头安全靴和手套"},{"key":"C","en":"Eye protection, gloves, and rubber boots.","zh":"护目装备、手套和橡胶靴"},{"key":"D","en":"Self-contained breathing apparatus, gloves and full body suits.","zh":"自给式呼吸器、手套和全身防护服"}],"answer":"C"},{"id":"Spill Control-7","section":"Spill Control","number":7,"en":"Proper absorbents should match the:","zh":"合适的吸收材料应与什么相匹配？","options":[{"key":"A","en":"Hazard of the chemical.","zh":"化学品的危险特性"},{"key":"B","en":"Place the chemical was spilled.","zh":"化学品泄漏的位置"},{"key":"C","en":"Color of the chemical.","zh":"化学品的颜色"}],"answer":"A"},{"id":"Spill Control-8","section":"Spill Control","number":8,"en":"What consideration should be made for flammable chemicals?","zh":"处理易燃化学品时，应重点考虑什么？","options":[{"key":"A","en":"Control of the vapors.","zh":"控制蒸气"},{"key":"B","en":"Control for the spread of the liquid.","zh":"控制液体扩散"},{"key":"C","en":"The low surface tension of the liquid.","zh":"液体的低表面张力"},{"key":"D","en":"Neutralization of the liquid.","zh":"中和液体"}],"answer":"A"},{"id":"Spill Control-9","section":"Spill Control","number":9,"en":"What consideration should be made for corrosive chemicals?","zh":"处理腐蚀性化学品时，应考虑什么？","options":[{"key":"A","en":"The low surface tension of the liquid.","zh":"液体的低表面张力"},{"key":"B","en":"Neutralization of the liquid.","zh":"中和液体"},{"key":"C","en":"Control for the spread of the liquid.","zh":"控制液体扩散"}],"answer":"B"},{"id":"Spill Control-10","section":"Spill Control","number":10,"en":"What consideration should be made for mercury spills?","zh":"处理汞泄漏时，应考虑什么？","options":[{"key":"A","en":"Control of the vapors.","zh":"控制蒸气"},{"key":"B","en":"Neutralization of the liquid.","zh":"中和液体"},{"key":"C","en":"Rapid amalgamation before evaporation to toxic levels in the air.","zh":"在汞蒸发导致空气中毒性浓度升高之前，迅速进行汞齐化处理"},{"key":"D","en":"The low surface tension of the liquid.","zh":"液体的低表面张力"}],"answer":"C"},{"id":"Spill Control-11","section":"Spill Control","number":11,"en":"What consideration should be made for biohazard spills?","zh":"处理生物危害物质泄漏时，应考虑什么？","options":[{"key":"A","en":"Control for the spread of the liquid.","zh":"控制液体扩散"},{"key":"B","en":"Disinfection of the biohazard.","zh":"对生物危害物质进行消毒"},{"key":"C","en":"Neutralization of the liquid.","zh":"中和液体"},{"key":"D","en":"Notification of National Institutes of Health.","zh":"通知美国国立卫生研究院"}],"answer":"B"},{"id":"Spill Control-12","section":"Spill Control","number":12,"en":"What consideration should be made for spills of radioactive materials?","zh":"处理放射性物质泄漏时，应考虑什么？","options":[{"key":"A","en":"The chemical hazards in which the radioactivity is carried.","zh":"放射性物质载体本身的化学危害"},{"key":"B","en":"The health of injured individuals.","zh":"受伤人员的健康状况"},{"key":"C","en":"Notification of the Nuclear Regulatory Commission.","zh":"通知核管理委员会"},{"key":"D","en":"Control of the aerosolization of the radioactivity.","zh":"控制放射性物质形成气溶胶"}],"answer":"A"},{"id":"Spill Control-13","section":"Spill Control","number":13,"en":"Tools used to clean spills:","zh":"用于清理泄漏物的工具应满足什么要求？","options":[{"key":"A","en":"Should be compatible with the hazard of the chemicals cleaned.","zh":"应与所清理化学品的危险特性相兼容"},{"key":"B","en":"Are usually metal.","zh":"通常由金属制成"},{"key":"C","en":"May be grabbed from the custodial closet.","zh":"可以直接从清洁用品储藏柜中取用"},{"key":"D","en":"Are always treated as waste.","zh":"始终作为废弃物处理"}],"answer":"A"},{"id":"Spill Control-14","section":"Spill Control","number":14,"en":"Call for help in cleaning a spill when:","zh":"在什么情况下应寻求专业帮助清理泄漏物？","options":[{"key":"A","en":"The spill is health threatening.","zh":"泄漏对健康构成威胁"},{"key":"B","en":"You are too tired to clean the spill.","zh":"你太累而无法清理泄漏物"},{"key":"C","en":"There is a lack of proper equipment or training.","zh":"缺乏合适的设备或培训"},{"key":"D","en":"Both, the spill is health threatening, and there is a lack of proper equipment or training.","zh":"泄漏危及健康，或者缺乏适当的设备或培训"}],"answer":"D"},{"id":"Spill Control-15","section":"Spill Control","number":15,"en":"If in doubt about whether to call for help or not:","zh":"如果不确定是否应该寻求帮助，应如何处理？","options":[{"key":"A","en":"Get a recommendation from your fellow workers.","zh":"向同事征求建议"},{"key":"B","en":"Become a hero for saving the laboratory.","zh":"成为拯救实验室的英雄"},{"key":"C","en":"Try to clean it before it escalates to a larger scenario.","zh":"尝试在事故扩大前自行清理"},{"key":"D","en":"Call for help.","zh":"寻求帮助"}],"answer":"D"},{"id":"Spill Control-16","section":"Spill Control","number":16,"en":"The first step in safely cleaning a spill is:","zh":"安全清理泄漏物的第一步是什么？","options":[{"key":"A","en":"Decontamination.","zh":"去污"},{"key":"B","en":"Containment.","zh":"围堵"},{"key":"C","en":"Assessment.","zh":"评估"},{"key":"D","en":"Cleaning.","zh":"清理"}],"answer":"C"},{"id":"Spill Control-17","section":"Spill Control","number":17,"en":"Assessment means answering a number of questions. The amount of time it takes is:","zh":"评估意味着回答一系列问题。评估通常需要多长时间？","options":[{"key":"A","en":"About 15 minutes since people have to be interviewed.","zh":"大约15分钟，因为需要采访相关人员"},{"key":"B","en":"About 5 hours while waiting for chemical analysis.","zh":"大约5小时，因为需要等待化学分析结果"},{"key":"C","en":"About 15 seconds since ballpark figures are okay.","zh":"大约15秒，因为可以采用粗略估计"},{"key":"D","en":"About 10 minutes since measurements must be taken.","zh":"大约10分钟，因为必须进行测量"}],"answer":"C"},{"id":"Spill Control-18","section":"Spill Control","number":18,"en":"Containing the spill means spreading the absorbent:","zh":"围堵泄漏物时，应如何铺撒吸收材料？","options":[{"key":"A","en":"At one side, scoop it up, and continue across the spill.","zh":"从一侧开始，边吸收边铲起，逐步清理整个泄漏区域"},{"key":"B","en":"Only until professional help arrives.","zh":"仅在专业人员到达之前进行"},{"key":"C","en":"Working from the outside into the center.","zh":"从外围向中心进行"}],"answer":"C"},{"id":"Spill Control-19","section":"Spill Control","number":19,"en":"Picked up absorbent should be placed:","zh":"收集起来的吸收材料应放在哪里？","options":[{"key":"A","en":"Down the sink.","zh":"倒入水槽"},{"key":"B","en":"In a trash can.","zh":"放入普通垃圾桶"},{"key":"C","en":"In a labeled, sealed container.","zh":"放入有标签的密封容器"},{"key":"D","en":"In an isolated area, awaiting professional disposal.","zh":"放在隔离区域等待专业处理"}],"answer":"C"},{"id":"Spill Control-20","section":"Spill Control","number":20,"en":"Decontamination may be tested by:","zh":"可以通过什么方法检测去污效果？","options":[{"key":"A","en":"Residual odors.","zh":"残留气味"},{"key":"B","en":"Best guesstimation.","zh":"根据经验进行粗略估计"},{"key":"C","en":"Slickness of the floor or benchtop.","zh":"地面或实验台表面的光滑程度"},{"key":"D","en":"Wipe tests and analysis.","zh":"擦拭采样测试与分析"}],"answer":"D"},{"id":"Spill Control-21","section":"Spill Control","number":21,"en":"One commonly contaminated area frequently overlooked is:","zh":"一个经常受到污染但容易被忽视的区域是什么？","options":[{"key":"A","en":"Under the cabinets.","zh":"柜子下面"},{"key":"B","en":"Down the sink.","zh":"水槽内部"},{"key":"C","en":"The employee skin.","zh":"工作人员的皮肤"},{"key":"D","en":"Inside equipment.","zh":"设备内部"}],"answer":"C"},{"id":"Spill Control-22","section":"Spill Control","number":22,"en":"Information relative to spills may be found:","zh":"有关泄漏事故的信息可以从哪里获得？","options":[{"key":"A","en":"In literature, material safety data sheets and labels.","zh":"文献、材料安全数据表和标签"},{"key":"B","en":"In material safety data sheets and newspapers.","zh":"材料安全数据表和报纸"},{"key":"C","en":"In material safety data sheets and labels.","zh":"材料安全数据表和标签"},{"key":"D","en":"On labels and in chemistry textbooks.","zh":"标签和化学教科书"}],"answer":"A"},{"id":"Spill Control-23","section":"Spill Control","number":23,"en":"Activated charcoal is a good absorbent for:",
