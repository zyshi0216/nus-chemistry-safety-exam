"zh":"活性炭适合吸收哪些化学品？","options":[{"key":"A","en":"Toxic and odoriferous chemicals.","zh":"有毒且有异味的化学品"},{"key":"B","en":"Reactive and toxic chemicals.","zh":"反应性和有毒化学品"},{"key":"C","en":"Corrosive and toxic materials.","zh":"腐蚀性和有毒物质"},{"key":"D","en":"Flammable and odoriferous chemicals.","zh":"易燃且有异味的化学品"}],"answer":"D"},{"id":"Spill Control-24","section":"Spill Control","number":24,"en":"Absorbents may take the form of:","zh":"吸收材料可以采用哪些形式？","options":[{"key":"A","en":"Liquids, powders and neutralizers.","zh":"液体、粉末和中和剂"},{"key":"B","en":"Powders, booms, and blankets.","zh":"粉末、围堵吸收条和吸收毯"},{"key":"C","en":"Pigs, pads, and skins.","zh":"吸收条、吸收垫和吸收片"},{"key":"D","en":"Granules, liquids and pads.","zh":"颗粒、液体和吸收垫"}],"answer":"B"},{"id":"Spill Control-25","section":"Spill Control","number":25,"en":"Proper spill control training should include:","zh":"适当的泄漏控制培训应包括什么？","options":[{"key":"A","en":"Formal classroom training.","zh":"正式的课堂培训"},{"key":"B","en":"Practice with the spill kits.","zh":"使用泄漏处理工具包进行实际操作练习"},{"key":"C","en":"An exam for certification.","zh":"参加认证考试"},{"key":"D","en":"The theory of fires.","zh":"火灾理论"}],"answer":"B"},{"id":"Toxics-1","section":"Toxics","number":1,"en":"All chemicals are toxic? This statement is:","zh":"“所有化学品都有毒”这一说法属于什么情况？","options":[{"key":"A","en":"An exaggeration.","zh":"一种夸张的说法"},{"key":"B","en":"An ancient tale.","zh":"一个古老的传说"},{"key":"C","en":"Only part of the story of toxicity.","zh":"只是毒性问题的一部分"},{"key":"D","en":"A scare tactic.","zh":"一种恐吓手段"}],"answer":"C"},{"id":"Toxics-2","section":"Toxics","number":2,"en":"The dose-response model is related to which three factors?","zh":"剂量-反应模型与哪三个因素有关？","options":[{"key":"A","en":"Relative toxicity, length of exposure and degree of ionization.","zh":"相对毒性、暴露时间和电离程度"},{"key":"B","en":"Relative toxicity, concentration, and strength.","zh":"相对毒性、浓度和强度"},{"key":"C","en":"Metabolic uptake, relative toxicity, and concentration.","zh":"代谢吸收、相对毒性和浓度"},{"key":"D","en":"Relative toxicity, concentration and length of exposure.","zh":"相对毒性、浓度和暴露时间"}],"answer":"D"},{"id":"Toxics-3","section":"Toxics","number":3,"en":"The term LD50 refers to:","zh":"术语 LD50 指的是什么？","options":[{"key":"A","en":"Absorption doses that are lethal to 50% of the test population.","zh":"导致50%测试群体死亡的吸收剂量"},{"key":"B","en":"Inhalation doses that are lethal to 50% of the test population.","zh":"导致50%测试群体死亡的吸入剂量"},{"key":"C","en":"Ingestion doses that are lethal to 50% of the test population.","zh":"导致50%测试群体死亡的摄入剂量"},{"key":"D","en":"Long distance exposures that are lethal to 50% of the test population.","zh":"导致50%测试群体死亡的远距离暴露"}],"answer":"C"},{"id":"Toxics-4","section":"Toxics","number":4,"en":"The threshold limit values (TLV) should be used as:","zh":"阈限值（TLV）应如何使用？","options":[{"key":"A","en":"Guidelines for exposure to the average worker.","zh":"作为普通工作人员接触化学品的指导参考值"},{"key":"B","en":"Strict limits that should never be exceeded.","zh":"绝对不能超过的严格限值"},{"key":"C","en":"Medical information for doctor evaluations.","zh":"供医生评估使用的医学信息"},{"key":"D","en":"State-of-the-art information for law suits.","zh":"用于法律诉讼的最新信息"}],"answer":"B"},{"id":"Toxics-5","section":"Toxics","number":5,"en":"Short-term Exposure Limits (STEL):","zh":"短时间接触限值（STEL）是指什么？","options":[{"key":"A","en":"May not be encountered more than once a day.","zh":"每天接触不得超过一次"},{"key":"B","en":"Are lower than TLV.","zh":"低于 TLV"},{"key":"C","en":"Are the absolute upper limit that an employee may be exposed to.","zh":"工作人员允许接触的绝对上限"}],"answer":"C"},{"id":"Toxics-6","section":"Toxics","number":6,"en":"The value set by OSHA and has the force of law behind it is the:","zh":"由美国职业安全与健康管理局（OSHA）制定且具有法律效力的限值是什么？","options":[{"key":"A","en":"Permissible Exposure Limit (PEL).","zh":"允许接触限值（PEL）"},{"key":"B","en":"Injurious Exposure Limit (IEL).","zh":"伤害性接触限值（IEL）"},{"key":"C","en":"Permitted Limit Value (PLV).","zh":"许可限值（PLV）"},{"key":"D","en":"OSHA Exposure Limit (OEL).","zh":"OSHA 接触限值（OEL）"}],"answer":"A"},{"id":"Toxics-7","section":"Toxics","number":7,"en":"Immediately Dangerous to Life or Health (IDLH) values:","zh":"立即危及生命或健康（IDLH）的数值指什么？","options":[{"key":"A","en":"Refer to concentrations of hazardous chemicals in air.","zh":"指空气中危险化学品的浓度"},{"key":"B","en":"Are really scary values.","zh":"是非常可怕的数值"},{"key":"C","en":"Refer to doses of chemicals swallowed at one time.","zh":"指一次吞入的化学品剂量"},{"key":"D","en":"Refer to quantities of hazardous chemicals spilled on the skin.","zh":"指洒落在皮肤上的危险化学品数量"}],"answer":"A"},{"id":"Toxics-8","section":"Toxics","number":8,"en":"Relative toxicity indices:","zh":"相对毒性指标的作用是什么？","options":[{"key":"A","en":"Do not give useful data since they were developed from animal studies.","zh":"由于来自动物实验，因此不能提供有用的数据"},{"key":"B","en":"Are arbitrarily set.","zh":"是任意设定的"},{"key":"C","en":"Are worthless because they speak only to the average worker.","zh":"没有价值，因为它们只针对普通工作人员"},{"key":"D","en":"Compare chemicals to each other by means of quantitative data.","zh":"通过定量数据比较不同化学品的毒性"}],"answer":"D"},{"id":"Toxics-9","section":"Toxics","number":9,"en":"The number of molecules of the toxic substance entering the body during any exposure is related to:","zh":"在任何暴露过程中，进入人体的有毒物质分子数量与什么有关？","options":[{"key":"A","en":"Metabolic uptake.","zh":"代谢吸收"},{"key":"B","en":"The ease of ionization.","zh":"电离的难易程度"},{"key":"C","en":"How easy the chemical absorbs through the skin.","zh":"化学品通过皮肤吸收的难易程度"},{"key":"D","en":"The concentration of the toxic chemical.","zh":"有毒化学品的浓度"}],"answer":"D"},{"id":"Toxics-10","section":"Toxics","number":10,"en":"The time of exposure influences the dose because:","zh":"为什么暴露时间会影响接触剂量？","options":[{"key":"A","en":"The longer the exposure, the less water one drinks.","zh":"暴露时间越长，喝水越少"},{"key":"B","en":"The longer the exposure, the more time the body has to develop symptoms.","zh":"暴露时间越长，身体越有时间出现症状"},{"key":"C","en":"The longer the exposure, the more molecules enter the body.","zh":"暴露时间越长，进入人体的化学物质分子越多"},{"key":"D","en":"The longer the exposure, the less one wants to leave.","zh":"暴露时间越长，越不想离开"}],"answer":"C"},{"id":"Toxics-11","section":"Toxics","number":11,"en":"Acute exposure differs from chronic exposure in which aspect(s)?","zh":"急性暴露与慢性暴露在哪些方面存在区别？","options":[{"key":"A","en":"Quantity of chemical and length of time exposed.","zh":"化学品接触量和暴露时间"},{"key":"B","en":"Rate of activation for the reaction.","zh":"反应的活化速率"},{"key":"C","en":"Number of witnesses to the exposure.","zh":"暴露事件的目击人数"},{"key":"D","en":"Concentration of chemicals.","zh":"化学品浓度"}],"answer":"A"},{"id":"Toxics-12","section":"Toxics","number":12,"en":"Chronic exposures are insidious because:","zh":"为什么慢性暴露具有隐蔽性？","options":[{"key":"A","en":"The latency period for effects may be 10–40 years.","zh":"健康影响的潜伏期可能长达10–40年"},{"key":"B","en":"Toxic exposures may not be observed, smelled or felt.","zh":"有毒物质的暴露可能无法通过视觉、嗅觉或感觉察觉"},{"key":"C","en":"Incomplete information may not be developed yet.","zh":"相关危害信息可能尚不完整"},{"key":"D","en":"All the above.","zh":"以上全部正确"}],"answer":"D"},{"id":"Toxics-13","section":"Toxics","number":13,"en":"The most common occupational route of entry for chemical exposure is:","zh":"职业环境中化学品进入人体最常见的途径是什么？","options":[{"key":"A","en":"Absorption.","zh":"吸收（如经皮肤吸收）"},{"key":"B","en":"Inhalation.","zh":"吸入"},{"key":"C","en":"Injection.","zh":"注射或刺入"},{"key":"D","en":"Ingestion.","zh":"摄入"}],"answer":"B"},{"id":"Toxics-14","section":"Toxics","number":14,"en":"Ventilation engineering controls which route of entry?","zh":"通风工程控制措施主要控制哪种化学品进入人体的途径？","options":[{"key":"A","en":"Injection.","zh":"注射或刺入"},{"key":"B","en":"Inhalation.","zh":"吸入"},{"key":"C","en":"Absorption.","zh":"吸收"}],"answer":"B"},{"id":"Toxics-15","section":"Toxics","number":15,"en":"Chemical absorption allows chemicals to enter which bodily system?","zh":"化学品经吸收后可进入人体的哪个系统？","options":[{"key":"A","en":"Neurological.","zh":"神经系统"},{"key":"B","en":"Digestion.","zh":"消化系统"},{"key":"C","en":"Circulatory.","zh":"循环系统"},{"key":"D","en":"Respiratory.","zh":"呼吸系统"}],"answer":"C"},{"id":"Toxics-16","section":"Toxics","number":16,"en":"Each glove fabric is permeable to _____ chemicals.","zh":"每种手套材料都可能被多少种化学品渗透？","options":[{"key":"A","en":"No.","zh":"没有任何化学品"},{"key":"B","en":"All.","zh":"所有化学品"},{"key":"C","en":"Some.","zh":"某些化学品"}],"answer":"C"},{"id":"Toxics-17","section":"Toxics","number":17,"en":"Ingestion of chemicals happens in laboratories by:","zh":"在实验室中，化学品可能通过哪些方式被摄入人体？","options":[{"key":"A","en":"Eating or drinking food and drink in the lab.","zh":"在实验室内吃东西或喝饮料"},{"key":"B","en":"Not washing hands after handling chemicals.","zh":"接触化学品后不洗手"},{"key":"C","en":"Barbecuing the results of the latest experiment.","zh":"烧烤最新实验的结果"},{"key":"D","en":"A and B.","zh":"A 和 B 都正确"}],"answer":"D"},{"id":"Toxics-18","section":"Toxics","number":18,"en":"Injection of chemicals happens from which objects?","zh":"化学品可能通过哪些物体刺入人体？","options":[{"key":"A","en":"Syringes.","zh":"注射器"},{"key":"B","en":"Broken glass.","zh":"破碎的玻璃"},{"key":"C","en":"Leaks in high pressure nozzles.","zh":"高压喷嘴泄漏"},{"key":"D","en":"All the above.","zh":"以上全部正确"}],"answer":"D"},{"id":"Toxics-19","section":"Toxics","number":19,"en":"Eyes are vulnerable to toxic chemicals because:","zh":"为什么眼睛容易受到有毒化学品的伤害？","options":[{"key":"A","en":"They have tissue that absorbs toxic chemicals easily.","zh":"眼部组织容易吸收有毒化学品"},{"key":"B","en":"They are necessary to complete the experiment.","zh":"完成实验需要使用眼睛"},{"key":"C","en":"One has to lean close to the experiment to see it.","zh":"必须靠近实验才能看清楚"},{"key":"D","en":"They are thin, wet and highly vascular.","zh":"眼部组织薄、湿润且血管丰富"}],"answer":"D"},{"id":"Toxics-20","section":"Toxics","number":20,"en":"An important piece of safety equipment vital to use of toxic chemicals is:","zh":"使用有毒化学品时，一项至关重要的安全设备是什么？","options":[{"key":"A","en":"A pair of tongs.","zh":"一把夹钳"},{"key":"B","en":"A fire extinguisher.","zh":"灭火器"},{"key":"C","en":"A fume hood.","zh":"通风橱"},{"key":"D","en":"An operating stirring plate.","zh":"正在运行的搅拌板"}],"answer":"C"},{"id":"Toxics-21","section":"Toxics","number":21,"en":"Types of personal protective equipment recommended for laboratories include:","zh":"实验室推荐使用的个人防护装备包括哪些？","options":[{"key":"A","en":"Gloves, lab coats and eye protection.","zh":"手套、实验服和眼部防护装备"},{"key":"B","en":"Hard hats and steel toed boots.","zh":"安全帽和钢头安全靴"},{"key":"C","en":"Self-contained breathing apparatus and full protective suits.","zh":"自给式呼吸器和全身防护服"},{"key":"D","en":"Finger cups and fully-enclosed shoes.","zh":"指套和全包覆式鞋子"}],"answer":"A"},{"id":"Toxics-22","section":"Toxics","number":22,"en":"Information about the toxicity and protective procedures may be found:","zh":"关于化学品毒性和防护措施的信息可以从哪里获取？","options":[{"key":"A","en":"Only the latest journal publications.","zh":"仅从最新的期刊论文中获取"},{"key":"B","en":"In specific books related to chemical toxicity.","zh":"从有关化学毒性的专业书籍中获取"},{"key":"C","en":"In material safety data sheets.","zh":"从材料安全数据表（MSDS/SDS）中获取"},{"key":"D","en":"By calling the chemical manufacturer.","zh":"通过联系化学品制造商获取"}],"answer":"C"},{"id":"Toxics-23","section":"Toxics","number":23,"en":"Laundering contaminated PPE reduces the dose by reducing the:","zh":"清洗受到污染的个人防护装备（PPE），可以通过减少哪些因素来降低接触剂量？","options":[{"key":"A","en":"Relative toxicity.","zh":"相对毒性"},{"key":"B","en":"Concentration.","zh":"浓度"},{"key":"C","en":"Length of exposure.","zh":"暴露时间"},{"key":"D","en":"B and C.","zh":"B 和 C 都正确"}],"answer":"D"},{"id":"Toxics-24","section":"Toxics","number":24,"en":"Minimizing the dose:","zh":"降低有毒化学品接触剂量会产生什么效果？","options":[{"key":"A","en":"Minimizes the number of experiments that may be performed.","zh":"减少可以进行的实验数量"},{"key":"B","en":"Minimizes the latency period for effects of toxic chemicals.","zh":"缩短有毒化学品产生影响的潜伏期"},{"key":"C","en":"Minimizes the severity of the response to toxic chemicals.","zh":"降低人体对有毒化学品产生不良反应的严重程度"}],"answer":"C"}];
const SECTIONS=[...new Set(BANK.map(q=>q.section))],BYID=Object.fromEntries(BANK.map(q=>[q.id,q]));
const KEY='lab-safety-nus-v2',OLDKEY='lab-safety-v1';
const app=document.getElementById('app');
function fresh(){return {version:2,history:[],mistakes:{},bookmarks:[]}}
function sanitize(x){let d=fresh();if(!x||typeof x!=='object')return d;d.history=Array.isArray(x.history)?x.history.filter(h=>h&&typeof h==='object').slice(0,5000):[];if(x.mistakes&&typeof x.mistakes==='object')for(let [id,m] of Object.entries(x.mistakes)){if(BYID[id]&&m&&typeof m==='object')d.mistakes[id]={count:Math.max(0,Number(m.count)||0),streak:Math.max(0,Number(m.streak)||0),mastered:!!m.mastered,last:String(m.last||'')}};d.bookmarks=Array.isArray(x.bookmarks)?[...new Set(x.bookmarks.filter(id=>BYID[id]))]:[];return d}
let db;try{db=sanitize(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)||'null'))}catch(e){db=fresh()}
let bilingual=false,exam=null,index=0,view='home',wrongSection='all',bookmarkSection='all';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Local storage is unavailable. Please export your records for backup.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function activeWrong(q){return !!db.mistakes[q.id]&&!db.mistakes[q.id].mastered}
function wrongCount(s){return BANK.filter(q=>(s==='all'||q.section===s)&&activeWrong(q)).length}
function marked(q){return db.bookmarks.includes(q.id)}
function bookmarkButton(q){return `<button class="bookmark ${marked(q)?'active':''}" onclick="toggleBookmark('${q.id}')">${marked(q)?'★ Bookmarked':'☆ Bookmark'}</button>`}
function toggleBookmark(id){if(!BYID[id])return;db.bookmarks=marked(BYID[id])?db.bookmarks.filter(x=>x!==id):[...db.bookmarks,id];persist();rerender()}
function rerender(){if(view==='exam')renderExam();else if(view==='result')renderResult();else if(view==='wrong')wrongBook();else if(view==='bookmarks')bookmarksPage();else if(view==='history')historyPage();else home()}
function setBilingual(v){bilingual=!!v;rerender()}
function langToggle(){return `<label class="toggle"><input type="checkbox" ${bilingual?'checked':''} onchange="setBilingual(this.checked)"> 中文 / Bilingual</label>`}
function head(){return `<div class="line"><span class="tag">NUS · Department of Chemistry</span>${langToggle()}</div>`}
function home(){view='home';exam=null;let total=SECTIONS.length,history=db.history;app.innerHTML=`<div class="panel">${head()}<div class="eyebrow" style="margin-top:18px">LABORATORY SAFETY · EXAM PREPARATION</div><h1>Chemistry Laboratory Safety Practice</h1><p class="muted">Independent practice resource for National University of Singapore (NUS), Department of Chemistry. Based on the supplied Laboratory Safety Series question bank.</p><div class="actions"><button class="primary" onclick="startExam('random')">Start Random Exam · 20 Questions</button><button onclick="startExam('wrong','all')">Practice Incorrect Questions</button><button onclick="startExam('bookmark','all')">Practice Bookmarks</button></div></div><div class="grid"><div class="metric"><span class="small muted">Question Bank</span><strong>${BANK.length}</strong><span class="small muted">${total} chapters</span></div><div class="metric"><span class="small muted">Completed Tests</span><strong>${history.length}</strong></div><div class="metric"><span class="small muted">Active Mistakes</span><strong>${wrongCount('all')}</strong></div><div class="metric"><span class="small muted">Bookmarked</span><strong>${db.bookmarks.length}</strong></div></div><div class="panel"><div class="line"><div><div class="eyebrow">CHAPTER PRACTICE</div><h2>Choose a Chapter</h2></div><span class="muted small">20 random questions or full chapter</span></div><div class="chapter-grid">${SECTIONS.map(s=>`<div class="chapter"><span class="tag">${BANK.filter(q=>q.section===s).length} questions</span><h3>${esc(s)}</h3><div class="small muted">${wrongCount(s)} active mistakes · ${db.bookmarks.filter(id=>BYID[id].section===s).length} bookmarks</div><div class="line"><button class="primary mini" onclick="startExam('chapter20','${esc(s)}')">20 Questions</button><button class="mini" onclick="startExam('chapterall','${esc(s)}')">Full Chapter</button><button class="mini" onclick="wrongBook('${esc(s)}')">Mistakes (${wrongCount(s)})</button></div></div>`).join('')}</div></div><div class="panel"><div class="eyebrow">DATA & NOTES</div><h2>Keep Your Progress</h2><p class="muted small">Results, incorrect answers, and bookmarks are stored in this browser. Export a JSON backup to transfer records to another device. Answers follow the supplied source key, including any disputed items.</p><div class="actions"><button onclick="exportData()">Export Records</button><button onclick="document.getElementById('importFile').click()">Import Records</button><button onclick="historyPage()">View Exam History</button></div></div>`}
function startExam(type,section='all'){let pool=type==='random'?BANK:type==='chapter20'||type==='chapterall'?BANK.filter(q=>q.section===section):type==='wrong'?BANK.filter(q=>activeWrong(q)&&(section==='all'||q.section===section)):BANK.filter(q=>marked(q)&&(section==='all'||q.section===section));if(!pool.length){alert('No questions available for this selection.');return}let count=type==='chapterall'?pool.length:Math.min(20,pool.length);exam={items:shuffle(pool).slice(0,count),answers:{},type,section,date:new Date().toISOString(),submitted:false};index=0;view='exam';renderExam()}
function renderExam(){if(!exam)return;view='exam';let q=exam.items[index],selected=exam.answers[q.id],answered=Object.keys(exam.answers).length,total=exam.items.length;app.innerHTML=`<div class="panel">${head()}<div class="line" style="margin-top:18px"><span class="tag">${esc(q.section)} · Source Q${q.number}</span>${bookmarkButton(q)}</div><div class="line" style="margin-top:18px"><strong>Question ${index+1} of ${total}</strong><span class="muted small">${answered} answered</span></div><div class="progress"><div style="width:${100*answered/total}%"></div></div><div class="question">${esc(q.en)}</div>${bilingual?`<div class="cn">${esc(q.zh)}</div>`:''}${q.options.map(o=>`<button class="option ${selected===o.key?'selected':''}" onclick="choose('${o.key}')"><span class="letter">${o.key}</span><span>${esc(o.en)}${bilingual&&o.zh?`<div class="cn">${esc(o.zh)}</div>`:''}</span></button>`).join('')}<div class="line" style="margin-top:23px"><button ${index===0?'disabled':''} onclick="index--;renderExam()">Previous</button><div class="actions">${index===total-1?`<button class="primary" onclick="submitExam()">Submit Exam</button>`:`<button class="primary" onclick="index++;renderExam()">Next Question</button>`}<button onclick="confirmExit()">Exit</button></div></div></div><div class="panel"><div class="small muted">Question Navigator</div><div class="steps">${exam.items.map((item,i)=>`<button class="${exam.answers[item.id]?'answered':''} ${i===index?'current':''}" onclick="index=${i};renderExam()">${i+1}${marked(item)?'★':''}</button>`).join('')}</div></div>`}
function choose(k){exam.answers[exam.items[index].id]=k;renderExam()}
function confirmExit(){if(confirm('Exit this exam? Unsaved answers will be lost.'))home()}
function submitExam(){let unanswered=exam.items.filter(q=>!exam.answers[q.id]).length;if(unanswered&&!confirm(`${unanswered} unanswered question(s). Submit anyway?`))return;let correct=0,results=[];for(let q of exam.items){let chosen=exam.answers[q.id]||null,ok=chosen===q.answer;if(ok)correct++;let m=db.mistakes[q.id];if(!ok){m=m||{count:0,streak:0,mastered:false};m.count=(m.count||0)+1;m.streak=0;m.mastered=false;m.last=new Date().toISOString();db.mistakes[q.id]=m}else if(m){m.streak=(m.streak||0)+1;if(m.streak>=2)m.mastered=true;db.mistakes[q.id]=m}results.push({id:q.id,chosen,answer:q.answer,correct:ok})}exam.submitted=true;exam.results=results;exam.correct=correct;exam.score=Math.round(correct/exam.items.length*100);db.history.unshift({date:exam.date,type:exam.type,section:exam.section,total:exam.items.length,correct,wrong:exam.items.length-correct,score:exam.score,results});persist();view='result';renderResult()}
function renderResult(){if(!exam||!exam.submitted)return;view='result';app.innerHTML=`<div class="panel">${head()}<div class="eyebrow" style="margin-top:16px">EXAM RESULTS</div><h1>${exam.score}% · ${exam.correct} / ${exam.items.length}</h1><p class="muted">${exam.items.length-exam.correct} incorrect or unanswered questions. All results have been saved locally.</p><div class="actions"><button class="primary" onclick="home()">Dashboard</button><button onclick="wrongBook(exam.section==='all'?'all':exam.section)">Review Mistakes</button><button onclick="repeatExam()">New Practice Test</button></div></div><div class="panel"><h2>Answer Review</h2><div class="small muted">The source answer key is preserved without corrections.</div></div>${exam.items.map((q,i)=>{let r=exam.results[i];return `<div class="panel"><div class="line"><span class="tag">${esc(q.section)} · Q${q.number}</span><div class="actions"><strong class="${r.correct?'status-good':'status-bad'}">${r.correct?'Correct':'Incorrect'}</strong>${bookmarkButton(q)}</div></div><div class="question">${i+1}. ${esc(q.en)}</div>${bilingual?`<div class="cn">${esc(q.zh)}</div>`:''}${q.options.map(o=>`<div class="option ${o.key===q.answer?'correct':o.key===r.chosen&&!r.correct?'incorrect':''}"><span class="letter">${o.key}</span><span>${esc(o.en)}${bilingual&&o.zh?`<div class="cn">${esc(o.zh)}</div>`:''}</span></div>`).join('')}<div class="review">Your answer: <strong>${r.chosen||'Not answered'}</strong> · Source answer: <strong>${q.answer}</strong></div></div>`}).join('')}`}
function repeatExam(){let t=exam.type,s=exam.section;startExam(t,s)}
function renderQuestionCard(q,kind){let m=db.mistakes[q.id];return `<div class="panel"><div class="line"><span class="tag">${esc(q.section)} · Q${q.number}</span><div class="actions">${m?`<span class="small ${m.mastered?'status-good':'status-bad'}">${m.mastered?'Mastered':'Needs review'} · ${m.count} errors</span>`:''}${bookmarkButton(q)}</div></div><div class="question">${esc(q.en)}</div>${bilingual?`<div class="cn">${esc(q.zh)}</div>`:''}<div class="small muted">Source answer: ${q.answer}. ${esc(q.options.find(o=>o.key===q.answer)?.en||'')}</div>${bilingual?`<div class="cn">${esc(q.options.find(o=>o.key===q.answer)?.zh||'')}</div>`:''}${kind==='wrong'?`<div style="margin-top:12px"><button class="mini" onclick="setMastered('${q.id}',${!m.mastered})">${m.mastered?'Mark as Needs Review':'Mark as Mastered'}</button></div>`:''}</div>`}
function setMastered(id,val){if(!db.mistakes[id])return;db.mistakes[id].mastered=val;db.mistakes[id].streak=val?2:0;persist();wrongBook(wrongSection)}
function sectionOptions(selected){return `<option value="all" ${selected==='all'?'selected':''}>All Chapters</option>`+SECTIONS.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function wrongBook(section=wrongSection){view='wrong';wrongSection=section;let list=BANK.filter(q=>db.mistakes[q.id]&&(section==='all'||q.section===section));let active=list.filter(q=>activeWrong(q));app.innerHTML=`<div class="panel">${head()}<div class="eyebrow" style="margin-top:16px">INCORRECT QUESTION REVIEW</div><h1>Incorrect Questions</h1><div class="sectionbar"><select class="select" onchange="wrongBook(this.value)">${sectionOptions(section)}</select><button class="primary" onclick="startExam('wrong','${esc(section)}')" ${!active.length?'disabled':''}>Practice Active Mistakes (${active.length})</button></div><p class="muted small">${list.length} previously missed · ${active.length} still active · ${list.length-active.length} mastered. Two consecutive correct attempts mark a question as mastered.</p></div>${list.length?list.map(q=>renderQuestionCard(q,'wrong')).join(''):'<div class="panel empty">No incorrect questions in this chapter yet.</div>'}`}
function bookmarksPage(section=bookmarkSection){view='bookmarks';bookmarkSection=section;let list=BANK.filter(q=>marked(q)&&(section==='all'||q.section===section));app.innerHTML=`<div class="panel">${head()}<div class="eyebrow" style="margin-top:16px">SAVED QUESTIONS</div><h1>Bookmarks</h1><div class="sectionbar"><select class="select" onchange="bookmarksPage(this.value)">${sectionOptions(section)}</select><button class="primary" onclick="startExam('bookmark','${esc(section)}')" ${!list.length?'disabled':''}>Practice Bookmarks (${list.length})</button></div></div>${list.length?list.map(q=>renderQuestionCard(q,'bookmark')).join(''):'<div class="panel empty">No bookmarked questions in this chapter.</div>'}`}
function historyPage(){view='history';app.innerHTML=`<div class="panel">${head()}<div class="line" style="margin-top:18px"><div><div class="eyebrow">STUDY PROGRESS</div><h1>Exam History</h1></div><div class="actions"><button onclick="exportData()">Export Records</button><button onclick="document.getElementById('importFile').click()">Import Records</button></div></div><div style="overflow:auto">${db.history.length?`<table class="history"><thead><tr><th>Date</th><th>Mode</th><th>Chapter</th><th>Correct</th><th>Score</th></tr></thead><tbody>${db.history.map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('en-SG'))}</td><td>${esc(h.type||'random')}</td><td>${esc(h.section||'All Chapters')}</td><td>${Number(h.correct)||0}/${Number(h.total)||0}</td><td><strong>${Number(h.score)||0}%</strong></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No completed exams yet.</div>'}</div></div><div class="panel"><h2>Backup & Restore</h2><p class="muted small">Exports include test history, answer-level results, mistakes, mastery status and bookmarks. Import replaces current local records after confirmation. Back up current data first.</p><div class="actions"><button onclick="exportData()">Export JSON Backup</button><button onclick="document.getElementById('importFile').click()">Import JSON Backup</button></div></div>`}
function exportData(){let payload={app:'NUS Chemistry Laboratory Safety Practice',schemaVersion:2,exportedAt:new Date().toISOString(),...db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nus-chemistry-lab-safety-records-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(input){let file=input.files?.[0];input.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('Backup exceeds 10 MB');let obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.history)||!obj.mistakes||typeof obj.mistakes!=='object')throw Error('Invalid backup structure');let imported=sanitize(obj);if(!confirm(`Import ${imported.history.length} test(s), ${Object.keys(imported.mistakes).length} mistake records and ${imported.bookmarks.length} bookmarks? This REPLACES your current local records.`))return;db=imported;persist();historyPage();alert('Records imported successfully.')}catch(e){alert('Import failed: '+e.message)}}
home();
</script></body></html>
